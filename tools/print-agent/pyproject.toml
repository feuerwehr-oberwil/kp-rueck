[project]
name = "kp-print-agent"
version = "0.9.0"
description = "KP Rück's print agent: ESC/POS thermal slips over the LAN"
requires-python = ">=3.10"

# NO required dependencies, deliberately. The core — HTTP and the protocol driver — is stdlib
# only, so the agent starts on a bare Python and a dry run needs nothing installed.
dependencies = []

[project.optional-dependencies]
# Needed for `output: escpos` (the 80 mm thermal printer) to put paper out. Imported lazily, so
# an agent without these installed still starts and reports a clear error when a job reaches it.
#
# pillow 12.2.0 is a security floor (e8c971b) that must not be relaxed. It also needs Python
# 3.10, which is why `requires-python` above says 3.10: the 3.9 allowance (and the markers that
# kept it resolvable) existed for the bare-Bullseye CUPS path of KP Front's A4 relay, which is
# gone.
escpos = [
    "python-escpos>=3.1",
    "pillow>=12.2.0",
]

[project.scripts]
kp-print-agent = "agent:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
norecursedirs = ["mutants", ".*", "__pycache__"]

[tool.mutmut]
source_paths = ["core.py", "protocols/"]
pytest_add_cli_args = ["-q", "-x"]
pytest_add_cli_args_test_selection = ["test_agent.py", "test_core.py", "test_protocol.py"]
also_copy = ["agent.py", "formatters.py", "outputs/"]
