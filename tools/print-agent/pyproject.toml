[project]
name = "kp-print-agent"
version = "0.9.0"
description = "One print agent for KP Front (PDF/CUPS) and KP Rück (ESC/POS thermal)"
requires-python = ">=3.9"

# NO required dependencies, deliberately. The core — HTTP, both protocol drivers and the
# CUPS output — is stdlib only, so the agent installs on a bare Raspberry Pi with no venv
# and no Docker. That is the install path stations actually use for the A4 relay.
dependencies = []

[project.optional-dependencies]
# Only needed for `output: escpos` (the 80 mm thermal printer). Imported lazily, so an agent
# without these installed still runs fine for CUPS backends and reports a clear error if a
# thermal job ever reaches it.
#
# The 3.11 marker is what keeps `requires-python = ">=3.9"` above honest. Pillow 13 needs
# 3.11, and 13.0.0 is a security floor that must not be relaxed (the advisories against
# Pillow 12 are fixed only there) — so without the marker the two lines contradict each other
# and every resolve fails, `uv run` included. python-escpos carries the same marker, or an
# older Python would get it with an older Pillow. Nothing is lost: 3.9 is the bare-Bullseye
# CUPS path, which needs no extra at all, while the thermal path runs on the Dockerfile's
# Python (or uv on the Pi).
#
# `uv.lock` pins what the image installs (`uv sync --locked` in the Dockerfile). After a change
# here run `uv lock` in this directory and commit the lockfile with it.
escpos = [
    "python-escpos>=3.1; python_version >= '3.11'",
    "pillow>=13.0.0; python_version >= '3.11'",
]

[project.scripts]
kp-print-agent = "agent:main"

[tool.uv]
package = false

[tool.pytest.ini_options]
norecursedirs = ["mutants", ".*", "__pycache__"]
