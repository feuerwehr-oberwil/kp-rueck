<!doctype html>
<!--@template
  This file is the TEMPLATE. The served page (404.html) is built from it –
  anything written into that is lost on the next build.
  Text belongs in content/<language>.json under `notFound`, structure belongs here.
-->
<html lang="{{baseLang}}">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{baseTitle}}</title>
<!-- A 404 is not a page anybody should be sent to from a search result. -->
<meta name="robots" content="noindex">
<!--
  ⚠️ ABSOLUTE paths, everywhere on this page. GitHub Pages serves this ONE file for EVERY
  unmatched address, at every depth — /tippfehler, /fr/vieux-lien, /a/b/c — and the browser
  resolves relative URLs against that address, not against where the file lives. A relative
  `landing.css` would load on /tippfehler and 404 on /fr/vieux-lien: the 404 page would itself
  be broken exactly where somebody has already hit something broken.
-->
<!--@template icon:favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20width%3D'32'%20height%3D'32'%20viewBox%3D'0%200%20512%20512'%3E%3Cdefs%3E%3CradialGradient%20id%3D'kpr-tile'%20cx%3D'50%25'%20cy%3D'36%25'%20r%3D'80%25'%3E%3Cstop%20offset%3D'0%25'%20stop-color%3D'%2326344a'%2F%3E%3Cstop%20offset%3D'58%25'%20stop-color%3D'%231b2330'%2F%3E%3Cstop%20offset%3D'100%25'%20stop-color%3D'%23141a24'%2F%3E%3C%2FradialGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D'512'%20height%3D'512'%20rx%3D'114'%20fill%3D'url(%23kpr-tile)'%2F%3E%3Crect%20x%3D'3'%20y%3D'3'%20width%3D'506'%20height%3D'506'%20rx%3D'111'%20fill%3D'none'%20stroke%3D'%23fff'%20stroke-opacity%3D'.09'%20stroke-width%3D'6'%2F%3E%3Cg%20transform%3D'translate(256%20256)%20scale(1)%20translate(-256%20-264)'%3E%3Cg%20stroke%3D'%23b9c4d2'%20stroke-width%3D'18'%20stroke-linecap%3D'round'%3E%3Cline%20x1%3D'157.60000000000002'%20y1%3D'364'%20x2%3D'131.36'%20y2%3D'420'%2F%3E%3Cline%20x1%3D'354.40000000000003'%20y1%3D'364'%20x2%3D'380.64'%20y2%3D'420'%2F%3E%3C%2Fg%3E%3Crect%20x%3D'92'%20y%3D'100'%20width%3D'328'%20height%3D'268'%20rx%3D'14'%20fill%3D'%23fff'%2F%3E%3Crect%20x%3D'104'%20y%3D'122'%20width%3D'85.33333333333333'%20height%3D'60'%20rx%3D'7'%20fill%3D'%239fadbf'%2F%3E%3Crect%20x%3D'104'%20y%3D'202'%20width%3D'85.33333333333333'%20height%3D'60'%20rx%3D'7'%20fill%3D'%239fadbf'%2F%3E%3Crect%20x%3D'213.33333333333331'%20y%3D'122'%20width%3D'85.33333333333333'%20height%3D'60'%20rx%3D'7'%20fill%3D'%23e8392b'%2F%3E%3Crect%20x%3D'213.33333333333331'%20y%3D'202'%20width%3D'85.33333333333333'%20height%3D'60'%20rx%3D'7'%20fill%3D'%239fadbf'%2F%3E%3Crect%20x%3D'322.66666666666663'%20y%3D'122'%20width%3D'85.33333333333333'%20height%3D'60'%20rx%3D'7'%20fill%3D'%239fadbf'%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<!--@template /icon -->
<link rel="stylesheet" href="/landing.css">

<style>
  /* Inline, because this page has to stand up even when it is the only thing that loads.
     Everything it can take from landing.css (.btn, the colour tokens) it does. */
  .nf { display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; min-height: 80vh; padding: 72px 24px 88px; }
  .nf-code { font-family: var(--mono); font-size: 12.5px; font-weight: 500; letter-spacing: .14em;
    text-transform: uppercase; color: var(--red); margin: 0 0 18px; }
  .nf h1 { font-size: clamp(27px, 4.2vw, 42px); line-height: 1.12; letter-spacing: -.02em;
    color: var(--ink); margin: 0 0 14px; }
  .nf-lead { font-size: 17px; line-height: 1.6; color: var(--ink-dim); margin: 0 0 30px; max-width: 46ch; }
  .nf-acts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .nf-links { display: flex; flex-wrap: wrap; gap: 10px 26px; justify-content: center;
    margin-top: 34px; padding-top: 24px; border-top: 1px solid var(--line);
    width: 100%; max-width: 620px; }
  .nf-links a { font-size: 14.5px; font-weight: 600; color: var(--ink-dim); text-decoration: none; }
  .nf-links a:hover { color: var(--ink); text-decoration: underline; }
  /* All languages ship in the one file; the script below reveals the matching one. With no JS
     the base language stays visible — which is the site's base language, not a blank page. */
  .nf[hidden] { display: none; }
</style>

<main>
{{#pages}}
<section class="nf" lang="{{lang}}" data-lang="{{lang}}"{{#hidden}} hidden{{/hidden}}>
  <p class="nf-code">{{notFound.code}}</p>
  <h1>{{notFound.title}}</h1>
  <p class="nf-lead">{{notFound.body}}</p>
  <div class="nf-acts">
    <a class="btn btn-primary" href="{{home}}">{{notFound.home}}</a>
    <a class="btn btn-ghost" href="https://demo.kp-rueck.ch" target="_blank" rel="noopener">{{notFound.demo}}</a>
  </div>
  <nav class="nf-links" aria-label="{{nav.aria}}">
    <a href="{{home}}#funktionen">{{nav.features}}</a>
    <a href="{{home}}#kontakt">{{nav.contact}}</a>
    <a href="https://github.com/feuerwehr-oberwil/kp-rueck" target="_blank" rel="noopener">GitHub</a>
    <a href="https://kp-front.ch">KP Front</a>
  </nav>
</section>
{{/pages}}
</main>

<script>
  // Which language the visitor was already in. The server cannot tell this page — one file
  // answers every address — so the first path segment does: /fr/vieux-lien → fr. Anything the
  // site does not publish keeps the base language that is already on screen, so a miss here
  // changes nothing. Each block carries its own links, so nothing has to be rewritten.
  (function () {
    var seg = location.pathname.split('/')[1]
    var wanted = seg && document.querySelector('.nf[data-lang="' + seg.replace(/[^a-z]/gi, '') + '"]')
    if (!wanted || !wanted.hidden) return
    var all = document.querySelectorAll('.nf')
    for (var i = 0; i < all.length; i++) all[i].hidden = all[i] !== wanted
    document.documentElement.lang = seg
  })()
</script>
</html>
