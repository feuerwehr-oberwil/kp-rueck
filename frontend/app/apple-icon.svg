<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 32 32">
  <!-- Same mark as icon.svg and kp-rueck.ch, at the size iOS asks for. The 32-unit viewBox is
       deliberate: the artwork stays ONE set of coordinates instead of a hand-scaled copy that
       could quietly diverge from the small icon.

       The background is full-bleed here, unlike the favicon: iOS masks a home-screen icon to its
       own squircle, so rounding it ourselves only risks dark slivers where our radius and Apple's
       disagree. -->
  <rect width="32" height="32" fill="#1b2330"/>
  <rect x="5.5" y="7" width="6.5" height="5.2" rx="1.5" fill="#e8392b"/>
  <rect x="5.5" y="14" width="6.5" height="5.2" rx="1.5" fill="#e7edf4"/>
  <rect x="5.5" y="21" width="6.5" height="4" rx="1.5" fill="#c4cedb" opacity=".5"/>
  <rect x="13.5" y="7" width="6.5" height="5.2" rx="1.5" fill="#ffffff"/>
  <rect x="13.5" y="14" width="6.5" height="4" rx="1.5" fill="#c4cedb" opacity=".5"/>
  <rect x="21.5" y="7" width="6.5" height="5.2" rx="1.5" fill="#d8e1ec"/>
  <rect x="21.5" y="14" width="6.5" height="4" rx="1.5" fill="#c4cedb" opacity=".5"/>
</svg>
