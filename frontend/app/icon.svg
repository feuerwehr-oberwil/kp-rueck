<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- The KP Rück mark, the same artwork as on kp-rueck.ch: the Magnettafel it digitises —
       cards in three columns, one of them red because something is running. Kept identical to
       the website rather than drawn a second time, so the tab, the home screen and the landing
       page cannot drift apart. -->
  <rect width="32" height="32" rx="7" fill="#1b2330"/>
  <rect x="5.5" y="7" width="6.5" height="5.2" rx="1.5" fill="#e8392b"/>
  <rect x="5.5" y="14" width="6.5" height="5.2" rx="1.5" fill="#e7edf4"/>
  <rect x="5.5" y="21" width="6.5" height="4" rx="1.5" fill="#c4cedb" opacity=".5"/>
  <rect x="13.5" y="7" width="6.5" height="5.2" rx="1.5" fill="#ffffff"/>
  <rect x="13.5" y="14" width="6.5" height="4" rx="1.5" fill="#c4cedb" opacity=".5"/>
  <rect x="21.5" y="7" width="6.5" height="5.2" rx="1.5" fill="#d8e1ec"/>
  <rect x="21.5" y="14" width="6.5" height="4" rx="1.5" fill="#c4cedb" opacity=".5"/>
</svg>
