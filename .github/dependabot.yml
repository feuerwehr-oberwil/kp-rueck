version: 2
updates:
  # Frontend (pnpm)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep noise down: batch non-major bumps into one PR.
      minor-and-patch:
        update-types: [minor, patch]

  # Backend (uv / pip-compatible)
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Print agent — its own lockfile, and it decodes images, so it drifts on the same
  # advisories as the backend rather than tracking it automatically.
  - package-ecosystem: pip
    directory: "/print-agent"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Base images. Added after Node 20 sat three months past its 2026-04-30 end-of-life in
  # frontend/Dockerfile without anything proposing the bump: npm, pip and actions were all
  # watched, and the one dependency a station actually RUNS was not. One entry per
  # Dockerfile — dependabot does not recurse.
  - package-ecosystem: docker
    directories:
      - "/frontend"
      - "/backend"
      - "/print-agent"
      - "/tileserver"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
