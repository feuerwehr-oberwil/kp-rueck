version: 2
updates:
  # Frontend (pnpm)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types describe the runtime, and the runtime is Node 24 (frontend/Dockerfile). A
      # major ahead of it (#104 proposed 26) types APIs the image does not have. Bump this by
      # hand together with the base image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Keep noise down: batch non-major bumps into one PR.
      minor-and-patch:
        update-types: [minor, patch]

  # Backend (uv / pip-compatible)
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Print agent — its own lockfile, and it decodes images, so it drifts on the same
  # advisories as the backend rather than tracking it automatically.
  - package-ecosystem: pip
    directory: "/tools/print-agent"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Base images. Added after Node 20 sat three months past its 2026-04-30 end-of-life in
  # frontend/Dockerfile without anything proposing the bump: npm, pip and actions were all
  # watched, and the one dependency a station actually RUNS was not. One entry per
  # Dockerfile — dependabot does not recurse.
  - package-ecosystem: docker
    directories:
      - "/frontend"
      - "/backend"
      - "/tools/print-agent"
      - "/tileserver"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node majors move by hand, LTS to LTS, together with NODE_VERSION in the workflows and
      # @types/node. Node 25 and later no longer ship corepack, which both frontend
      # Dockerfiles use to install pnpm, so #98 (20 → 26) could not even build.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # The same image under the name Dependabot gives it on ECR Public, where the Dockerfiles
      # pull it from since 09.10.2026 (public.ecr.aws/docker/library/node).
      - dependency-name: "docker/library/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
