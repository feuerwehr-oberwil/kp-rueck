name: Bug report
description: Report something that doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Deutsch ist willkommen** — schreib in der Sprache, die dir leichter fällt.

        The fastest way to fill this in is from inside the app: open **Einstellungen ›
        Fehlerberichte**. Newer versions let you describe the problem, pick «Als
        GitHub-Issue melden» and click **Weiter** — that prefills this form and saves a
        **Diagnose-Datei** to attach below. Older ones show a technical block you can
        copy. Either is already sanitised — no incident data, no addresses, no names.

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: |
        Fahrzeug auf einen anderen Einsatz gezogen, danach war das Board weiss und
        liess sich nur mit Neuladen wiederbeleben.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Even a rough sequence helps. "It just happened" is a valid answer if that's the truth.
      placeholder: |
        1. Einsatz öffnen
        2. Fahrzeug per Drag & Drop auf «Im Einsatz» ziehen
        3. Board weiss
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Drag the Diagnose-Datei in here if your version offers one, otherwise paste the
        technical block from Einstellungen › Fehlerberichte. Without this a report usually
        cannot be acted on — it is the part that carries the actual error.
      render: text
      placeholder: |
        Version   v0.7.0 · a1b2c3d
        Sprache   de-CH
        Gerät     Chrome auf Windows
        Fenster   1920×1080
        Netz      online
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Einstellungen, and in the first line of the technical block.
      placeholder: v0.7.0 · a1b2c3d
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where in the app?
      options:
        - Board (Kanban)
        - Karte / map
        - Reko
        - Personal / Fahrzeuge / Material
        - Übung / training mode
        - Rapport / Druck / export
        - Alarmierung / Divera / integrations
        - Einstellungen / Admin
        - Login / start-up
        - Somewhere else / not sure
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before you send
      options:
        - label: >-
            This report contains no station data — no incident details, addresses, roster
            names, or credentials.
          required: true
