name: CI

# CI strategy – keep this comment truthful, it is the only place the split is written down.
#
# BLOCKING (a red one of these must stop a merge; these are the checks required on main):
#   secrets, backend-lint, backend-security, backend-test, frontend-lint, frontend-typecheck,
#   frontend-unit-tests, frontend-build, images
#
# ADVISORY (runs, reports, never fails the build) – with the real numbers as of 2026-07-26,
# so nobody has to guess how far off "make it blocking" is:
#   backend-typecheck  mypy – ~690 errors outside the blocking subset (app/auth, app/middleware,
#                             app/schemas, app/services/alerting are at zero and gate). Moving a
#                             package into the blocking list is the unit of progress; see
#                             docs/plans/14-typing-debt.md.
# It stays advisory deliberately: a check that is always red teaches people to ignore red.
# bandit used to be on this list and is now blocking — its one outstanding finding was reviewed
# and annotated, so the scan is clean and a NEW medium-or-worse finding has to be dealt with.
#
# NOT A MERGE GATE, but not optional either:
#   codeql.yml – cross-file taint tracking, reports into the Security tab on a weekly schedule
#                and per PR. A new alert is work, not something to click past.
#
# RUNS, BUT NOT YET A REQUIRED CHECK:
#   e2e-smoke – eight @smoke-tagged Playwright specs on the core path. It used to be `if: false`
#         and covered nothing. It is deliberately NOT in the required-checks list on main until
#         it has proved stable across a handful of real runs; see the comment on the job. The
#         full ~300-spec suite is a human step (`cd frontend && pnpm test:e2e`) plus the nightly
#         schedule in e2e-nightly.yml.
#
# Coverage: min 35% (target: 50% → 70%).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this whole gate against the tag before publishing images.
  workflow_call:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"   # Active LTS; 20 went EOL 2026-04-30. Match frontend/Dockerfile.
  PNPM_VERSION: "9"
  # Seeds the throwaway E2E database and is what the specs log in with. Not a secret — the
  # database and the container both die with the job — but it must be >= 12 chars, and the
  # seed step and the specs must read the SAME value or every spec fails at the login screen.
  E2E_PASSWORD: "e2e-ci-password-not-a-secret"  # gitleaks:allow

jobs:
  # ============================================
  # Secrets
  # ============================================
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CLI via container (not gitleaks-action, which needs a license key for org repos).
      # Scans exactly the TRACKED tree at HEAD (git archive), so a contributor's local .env
      # and node_modules never enter the picture. Deliberate test values carry inline
      # `gitleaks:allow` comments — the CI .env in the images job is generated at runtime
      # with openssl, so there is nothing to allow there.
      - name: Scan tracked tree for secrets
        run: |
          mkdir -p /tmp/scan
          git archive HEAD | tar -x -C /tmp/scan
          docker run --rm -v /tmp/scan:/repo zricethezav/gitleaks:latest \
            detect --source /repo --no-git --redact --exit-code 1

  # ============================================
  # Backend Quality Checks
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      # Blocking for the modules that are clean, advisory for the rest. Splitting it this way
      # is the point: one gate over the whole tree could only ever be advisory (there are
      # ~690 findings left, see docs/plans/14-typing-debt.md), and an advisory gate is one
      # nobody reads. These paths are at zero and must stay there.
      - name: Type check with mypy (blocking subset)
        run: uv run mypy app/auth app/middleware app/schemas app/services/alerting --ignore-missing-imports

      # The rest, as a report. Moving a package out of here and into the step above is the
      # unit of progress — don't widen the blocking list without getting it to zero first.
      - name: Type check with mypy (rest, advisory)
        run: uv run mypy app --ignore-missing-imports
        continue-on-error: true

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Pinned to the project's Python. Bandit installed with uv's default interpreter ran
      # on 3.11, could not parse 3.12 syntax, and SKIPPED app/crud/base.py entirely — a
      # blocking security gate quietly not looking at a file. It reports "Files skipped (0)".
      - name: Install bandit
        run: uv tool install --python ${{ env.PYTHON_VERSION }} bandit

      # Blocking. It was advisory while one finding was outstanding; that finding was reviewed
      # (B104 in config.py — does not apply to a containerised service) and annotated, so the
      # scan is clean and a NEW medium-or-worse finding must now be dealt with rather than
      # scrolled past. Annotate a false positive at the line with `# nosec BXXX` and a reason.
      - name: Security scan with Bandit
        run: uv tool run --python ${{ env.PYTHON_VERSION }} bandit -r app -ll -ii -x app/tests

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U kprueck; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=35 -v
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck_test
          SECRET_KEY: ci-test-secret-key-not-for-production-use-1234567890

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # Frontend Quality Checks
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (Vitest)
        run: pnpm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ============================================
  # E2E — the @smoke subset only (docs/plans/15-e2e-in-ci.md, phases 2 and 3).
  #
  # The full suite is ~300 specs at ~25 minutes and flaky enough that a red result had stopped
  # carrying information, so it stayed switched off entirely and CI covered no click-through at
  # all. This runs the eight specs on the paths where a break is both plausible and expensive:
  # log in, land on the board, create an event, select it, create an incident, and alarm intake
  # in and out. Tag more with `{ tag: '@smoke' }` as they prove stable.
  #
  # NOT YET IN THE REQUIRED-CHECKS LIST on main, on purpose. Phase 1 of the plan — run it
  # repeatedly against an unchanged tree and see which specs flake — has not been done, and
  # promoting an unmeasured suite to a merge gate is how you get a red job people learn to click
  # through. Let it run on a few PRs first; when it has been green across runs it did not
  # deserve to be, add "E2E (@smoke)" to branch protection. Until then a red result here is
  # information, not a blocker.
  #
  # The full suite stays a human step before a release and after touching auth, the board or
  # alarm intake: `cd frontend && pnpm test:e2e` (needs `just dev`). e2e-nightly.yml runs it on
  # a schedule.
  # ============================================
  e2e-smoke:
    name: E2E (@smoke)
    runs-on: ubuntu-latest
    # The whole point is a fast signal; if it is not fast it is not doing its job.
    timeout-minutes: 15
    needs: [backend-test, frontend-build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Python
        working-directory: backend
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # ADMIN_SEED_PASSWORD has to be set and has to match what the specs log in with.
      # Without it the seed mints a RANDOM development password, and every spec fails at the
      # login screen — one of the reasons this job could not simply be switched back on.
      # No ENVIRONMENT=production here on purpose: the specs need the dev fixture board
      # (vehicles, personnel, materials), which a production seed deliberately omits.
      - name: Seed database
        working-directory: backend
        run: uv run python -m app.seed
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          ADMIN_SEED_PASSWORD: ${{ env.E2E_PASSWORD }}
          VIEWER_PASSWORD: ${{ env.E2E_PASSWORD }}

      - name: Start backend server
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          CORS_ORIGINS: http://localhost:3000

      - name: Run E2E tests (@smoke)
        working-directory: frontend
        run: pnpm exec playwright test --grep @smoke
        env:
          TEST_USERNAME: admin
          TEST_PASSWORD: ${{ env.E2E_PASSWORD }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # Images: build all four, boot the production stack, smoke it
  # ============================================
  # This is the job that makes a published release trustworthy: it builds the SAME images
  # release.yml pushes, boots them through docker-compose.yml exactly as a self-hoster would,
  # and proves the one thing that can't be unit-tested — that the four containers can talk to
  # each other behind Caddy on a single origin.
  images:
    name: Images (build + boot + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write .env (compose reads it before anything else)
        run: |
          {
            echo "POSTGRES_PASSWORD=ci_test_password"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "AUTH_SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_SEED_PASSWORD=$(openssl rand -hex 16)"
            echo "VIEWER_PASSWORD=$(openssl rand -hex 16)"
            echo "HTTP_PORT=8080"
            echo "PUBLIC_URL=http://localhost:8080"
            # compose pulls ghcr.io/…:${KP_RUECK_TAG:-latest}; point it at the images built
            # below so the stack boots THIS commit instead of the last published release.
            echo "KP_RUECK_TAG=ci"
          } > .env

      - name: Validate compose config
        run: docker compose config -q

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Built WITHOUT NEXT_PUBLIC_API_URL on purpose: the published image must not carry any
      # one station's API URL. The browser calls /backend-api on its own origin instead.
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runner
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build tileserver image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tileserver/Dockerfile
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-tileserver:ci
          cache-from: type=gha,scope=tileserver
          cache-to: type=gha,mode=max,scope=tileserver

      # Not booted (it needs a printer on the LAN), but built so a broken Dockerfile can't
      # reach a release.
      - name: Build print-agent image
        uses: docker/build-push-action@v7
        with:
          context: ./print-agent
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-print-agent:ci
          cache-from: type=gha,scope=print-agent
          cache-to: type=gha,mode=max,scope=print-agent

      - name: Boot the stack
        run: docker compose up -d --wait   # waits for db/backend/frontend/tileserver health

      - name: Smoke test (everything through the single origin)
        run: |
          set -euo pipefail
          # Backend, routed by Caddy.
          curl -fsS http://localhost:8080/health
          # Backend through the Next.js proxy — the path a browser takes when the image
          # carries no baked-in API URL. This is the whole generic-image premise.
          curl -fsSL http://localhost:8080/backend-api/health
          # The app itself renders. Written to a file first: `curl | grep -q` exits on the
          # first match, curl dies of SIGPIPE, and pipefail turns a PASS into a failure.
          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -qi "<html" /tmp/index.html || { echo "frontend did not render"; exit 1; }
          # Offline tiles reachable on the same origin.
          curl -fsS http://localhost:8080/tiles/health
          # Log in as the seeded admin and reuse the cookie: proves auth, the DB, first-boot
          # seeding and the cookie flags all work through the single origin — the path every
          # operator takes, and the one a broken deployment fails at.
          admin_pw=$(grep '^ADMIN_SEED_PASSWORD=' .env | cut -d= -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/cookies.txt \
            -X POST http://localhost:8080/api/auth/login \
            -d "username=admin&password=${admin_pw}")
          test "$code" = "200" || { echo "login failed: HTTP $code"; exit 1; }
          curl -fsS -b /tmp/cookies.txt http://localhost:8080/api/auth/me > /dev/null
          echo "stack smoke OK"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
