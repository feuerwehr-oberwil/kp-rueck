name: CI

# CI strategy – keep this comment truthful, it is the only place the split is written down.
#
# BLOCKING (a red one of these must stop a merge; these are the checks required on main):
#   secrets, backend-lint, backend-test, backend-security, print-agent, frontend-lint,
#   frontend-typecheck, frontend-unit-tests, frontend-security, frontend-build, images, e2e-smoke
#   plus backend-typecheck's FIRST step (mypy over the packages that are at zero)
#   plus shared-files («Shared files match KP Front») — the ONLY check that compares anything
#   against kp-front; the in-repo manifest test cannot see the other repository. It replaced
#   five per-file drift jobs on 2026-10-09 (four of them required since 2026-09-23, the snail
#   one on probation): one manifest, one script, the same job in kp-front, and the output
#   still names which question failed. It reads `env.SIBLING_REPO` and SKIPS (never fails)
#   when that is empty or cannot be checked out, so a fork inherits an honest "not checked"
#   rather than a red X against a repository it has nothing to do with. It still fails on
#   real drift for the upstream pair.
#
# ADVISORY (runs, reports, never fails the build) – with the real numbers as of 2026-07-30:
#   backend-typecheck  mypy, second step – 55 errors in 7 files across the packages NOT in the
#                      blocking subset (was 711 in 79). app/crud, app/background,
#                      websocket_manager.py, models.py, traccar.py, app/api and — since
#                      2026-07-30 — app/services have all been cleared and moved into the
#                      blocking step. What is left is the seed scripts (46), app/telemetry (14,
#                      excluded deliberately: vendored byte-identical with kp-front and pinned
#                      by checksum) and app/main (3). The advisory step is now nearly empty,
#                      and the remainder is either out of scope on purpose or run-once-by-hand.
#   codecov upload   – never worth failing a build over.
#
# bandit used to be here too, at "52 findings". That number was misleading: with the `-ll -ii`
# threshold the run reported exactly ONE medium finding (B104, which does not apply to a
# containerised service). It was reviewed, annotated at the line, and the gate is now blocking.
# The rest sit below the threshold and were never reported.
#
# The rule behind the split: a check that is always red teaches people to ignore red. Either a
# gate is at zero and blocks, or it is honestly labelled a report.
#
# NOT A MERGE GATE, but not optional either:
#   CodeQL – cross-file taint tracking, reporting into the Security tab per PR and weekly.
#            It runs from GitHub's DEFAULT setup (repo settings → Code security), not from a
#            workflow file in this repo, and it covers five languages there: actions,
#            javascript, javascript-typescript, python, typescript.
#            Do NOT add a `codeql.yml`: with default setup enabled, GitHub rejects the SARIF
#            an advanced workflow uploads, so the job fails while the real analysis passes
#            beside it. (kp-front is the other way round — default setup is off there, so it
#            needs its workflow file. Same coverage, different mechanism.)
#
# RUNS ON ITS OWN SCHEDULE, in restore-drill.yml:
#   restore-drill – seed, dump with scripts/backup.sh, restore into a FRESH empty database, diff
#         the row counts and real values, and check the restored database still migrates forward.
#         Weekly, plus on any PR that touches scripts/backup.sh, scripts/restore.sh,
#         backend/start.sh or a migration. It is the standing answer to "has anyone ever actually
#         restored one of these?" — the same reasoning as shared-files. It runs Postgres 17
#         (production), not the 16 that docker-compose.yml pins.
#
# ON PROBATION, NOT REQUIRED YET (added 2026-10-09):
#   visual – screenshot regression on nine frozen states (docs/VISUAL_TESTS.md). It blocks
#         nothing until it has been green on every run for a couple of weeks; then it goes into
#         branch protection like e2e-smoke did. A red one means the screen changed: read the
#         diff, and accept a deliberate change by regenerating the baselines on CI
#         (visual-baselines.yml) — never to turn the check green.
#
# REQUIRED SINCE 2026-08-21:
#   e2e-smoke – the @smoke-tagged Playwright specs on the core path. It used to be `if: false`
#         and covered nothing; it was then held out of the required list until it had proved
#         stable across real runs, and since 2026-08-21 it IS required on main. The full ~300-spec suite is a human step (`cd frontend && pnpm test:e2e`,
#         with `AUTH_BYPASS_AUTH_DEV=false` or the role assertions mean nothing) plus the
#         nightly schedule in e2e-nightly.yml.
#
# Coverage: backend floor 87% (`--cov-fail-under` in backend-test), set just under the real
# figure (88% on 2026-10-08, 3457 tests). Raise it when the real number moves; never lower it.

on:
  push:
    # Only `main` exists now. The old `develop` branch was deleted 2026-09-14 after it had
    # gone 38 commits stale; if a long-lived branch ever comes back, add it here – leaving
    # it out once cost a whole cycle (83 unchecked commits, 22 mypy errors found at merge).
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this whole gate against the tag before publishing images.
  workflow_call:

permissions:
  contents: read

env:
  # The sibling product the shared-files job compares against. THE ONE LINE A FORK CHANGES: point it at your own kp-front fork to
  # keep the check meaningful, or set it to "" to switch it off — it then SKIPS with a
  # message instead of failing you against upstream's files. Kept out of the jobs so there is
  # exactly one place to edit, and no ownership check hidden in an `if:` somewhere else.
  SIBLING_REPO: "feuerwehr-oberwil/kp-front"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"   # Active LTS; 20 went EOL 2026-04-30. Match frontend/Dockerfile.
  PNPM_VERSION: "9"
  # Seeds the throwaway E2E database and is what the specs log in with. Not a secret — the
  # database and the container both die with the job — but it must be >= 12 chars, and the
  # seed step and the specs must read the SAME value or every spec fails at the login screen.
  E2E_PASSWORD: "e2e-ci-password-not-a-secret"  # gitleaks:allow

jobs:
  # ============================================
  # Secrets
  # ============================================
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CLI via container (not gitleaks-action, which needs a license key for org repos).
      # Scans exactly the TRACKED tree at HEAD (git archive), so a contributor's local .env
      # and node_modules never enter the picture. Deliberate test values carry inline
      # `gitleaks:allow` comments — the CI .env in the images job is generated at runtime
      # with openssl, so there is nothing to allow there.
      - name: Scan tracked tree for secrets
        run: |
          mkdir -p /tmp/scan
          git archive HEAD | tar -x -C /tmp/scan
          # GHCR: the same image as Docker Hub's zricethezav/gitleaks, without its pull limit.
          docker run --rm -v /tmp/scan:/repo ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-git --redact --exit-code 1

  # ============================================
  # Backend Quality Checks
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      # Blocking for the modules that are clean, advisory for the rest. Splitting it this way
      # is the point: one gate over the whole tree could only ever be advisory, and an
      # advisory gate is one nobody reads.
      # These paths are at zero and must stay there.
      #
      # `app/services` joined on 2026-07-30 (183 -> 0), which leaves only 55 findings in the
      # advisory step: the seed scripts (46), `app/telemetry` (14, excluded on purpose — it is
      # vendored byte-identical with kp-front and pinned by checksum) and `app/main` (3).
      # In other words the advisory step is now almost empty, and what remains is either
      # deliberately out of scope or run-once-by-hand code.
      - name: Type check with mypy (blocking subset)
        run: >-
          uv run mypy
          app/auth app/middleware app/schemas app/services
          app/crud app/background app/api
          app/websocket_manager.py app/models.py app/traccar.py
          --ignore-missing-imports

      # The rest, as a report. Moving a package out of here and into the step above is the
      # unit of progress — don't widen the blocking list without getting it to zero first.
      - name: Type check with mypy (rest, advisory)
        run: uv run mypy app --ignore-missing-imports
        continue-on-error: true

  # The print agent is not part of the backend: it runs on a box in the station, and its core
  # is deliberately dependency-free. So it gets its own job with a plain Python — which also
  # proves the core still starts without the ESC/POS packages, since the run would fail here
  # if anything in it started needing one.
  print-agent:
    name: Print Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/print-agent

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests (stub backends, no printer needed)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

  # ── The cross-repository job: files shared with KP Front ─────────────────────────────────
  #
  # shared/MANIFEST.json lists every file this repository shares with KP Front by COPY: the
  # telemetry sanitiser ("could one app leak what the other strips"), the alarm keyword
  # vocabulary ("could the two classify an alarm differently"), the roster-snapshot contract and
  # reader ("could one station's roster file be valid here and refused there"), the alarm intake
  # corpus ("could one dispatch webhook be accepted by one app and refused by the other"), the
  # loading snail, and this check itself. Until 2026-10-09 these were five hand-written diff
  # jobs that only ran HERE, against kp-front's main; one manifest + one stdlib script
  # (scripts/check_shared.py), byte-identical in both repositories, replaced them, and kp-front
  # now runs the same job against this repository.
  #
  # backend/tests/test_shared_files.py holds THIS checkout to the manifest, offline. This job is
  # the only thing that reads kp-front. It compares against kp-front's branch of the SAME NAME
  # when one exists (on a push to main: the merged branch, read from the merge commit), else its
  # default branch — so a change made in both repositories on equally named branches is green
  # in both PRs at once, and a change made on one side only is red in the PR that made it.
  # One job, one required check: the output names the item, the file, the owner and the diff.
  #
  # FORKS: `env.SIBLING_REPO` at the top of this file is the ONE line a fork changes. Point it
  # at your own kp-front fork, or set it to "" — the job then SKIPS with a notice, as it does
  # when the sibling cannot be checked out. It never skips when the files differ: a check that
  # goes green when it could not answer the question is worse than no check.
  # How to change a shared file: shared/README.md.
  shared-files:
    name: Shared files match KP Front
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Pick the sibling's paired branch
        id: pair
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          ref="$HEAD_REF"
          if [ -z "$ref" ]; then
            ref=$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1 | sed -nE 's|^Merge pull request #[0-9]+ from [^/]+/(.+)$|\1|p')
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # `continue-on-error`: no branch of that name is the normal case, not a failure.
      - name: Check out the sibling's paired branch
        id: paired
        if: env.SIBLING_REPO != '' && steps.pair.outputs.ref != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SIBLING_REPO }}
          ref: ${{ steps.pair.outputs.ref }}
          path: .sibling
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the sibling's default branch
        id: default
        if: env.SIBLING_REPO != '' && steps.paired.outcome != 'success'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SIBLING_REPO }}
          path: .sibling
          fetch-depth: 1
          persist-credentials: false

      # The runner's own python3: the script is standard library only.
      - name: Compare the shared files
        env:
          SIBLING_STATUS: ${{ steps.paired.outcome == 'success' && 'success' || steps.default.outcome }}
          SIBLING_REF: ${{ steps.paired.outcome == 'success' && steps.pair.outputs.ref || 'its default branch' }}
        run: |
          if [ -z "${SIBLING_REPO:-}" ]; then
            echo "::notice::SIBLING_REPO is empty — the shared-files check is switched off for this fork."
            exit 0
          fi
          if [ "$SIBLING_STATUS" != "success" ]; then
            echo "::notice::Could not check out ${SIBLING_REPO} (private, renamed or unreachable) — skipping."
            echo "::notice::Set SIBLING_REPO in .github/workflows/ci.yml to a repository this workflow can read, or to ''."
            exit 0
          fi
          echo "Comparing with ${SIBLING_REPO} at ${SIBLING_REF}"
          python3 scripts/check_shared.py --sibling .sibling

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Pinned to the project's Python. Bandit installed with uv's default interpreter ran
      # on 3.11, could not parse 3.12 syntax, and SKIPPED app/crud/base.py entirely — a
      # blocking security gate quietly not looking at a file. It reports "Files skipped (0)".
      - name: Install bandit
        run: uv tool install --python ${{ env.PYTHON_VERSION }} bandit

      # Blocking. It was advisory while one finding was outstanding; that finding was reviewed
      # (B104 in config.py — does not apply to a containerised service) and annotated, so the
      # scan is clean and a NEW medium-or-worse finding must now be dealt with rather than
      # scrolled past. Annotate a false positive at the line with `# nosec BXXX` and a reason.
      - name: Security scan with Bandit
        run: uv tool run --python ${{ env.PYTHON_VERSION }} bandit -r app -ll -ii -x app/tests

      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o /tmp/backend-requirements.txt
          uv tool run --python ${{ env.PYTHON_VERSION }} pip-audit \
            --strict --disable-pip --no-deps -r /tmp/backend-requirements.txt

  frontend-security:
    name: Frontend Dependency Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: pnpm audit --prod --audit-level moderate

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # ECR Public mirror of the Docker Official Image (same image, same digest): Docker Hub's
        # anonymous pull limit failed CI jobs at random (09.10.2026). Same for every image CI pulls.
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U kprueck; do
            echo "Waiting for postgres..."
            sleep 2
          done

      # `-n 3` (pytest-xdist), NOT `-n auto`, and the number is measured, not guessed.
      #
      # This job used to be the whole gate's critical path: 1881 tests on one worker, ~8 min,
      # while every other job bar e2e-smoke finished inside a minute. It also grows with the
      # suite, so it only ever got worse.
      #
      # Measured on a container pinned to 4 vCPU (what a GitHub-hosted ubuntu-latest gives a
      # public repo), same suite, coverage on, one run each:
      #
      #   serial   305s      -n 3    132s   <- knee
      #   -n 2     178s      -n 4    138s
      #                      -n 6    140s
      #                      -n 8    142s
      #
      # Past three workers the curve is flat and then slightly negative: the suite spends its
      # time on Postgres round-trips, not on CPU, so extra workers buy nothing and start
      # costing context switches. `-n auto` is the trap — it reads the CORE COUNT, which is 4
      # here (and 10 on a developer's laptop, and 10 inside a `--cpus=4` container, because a
      # CPU quota does not change nproc). It would pick 4: measurably slower than 3, and on
      # other machines much worse.
      #
      # Three rather than four also leaves a core for the Postgres service container, which on
      # a real runner shares these same 4 vCPUs. The measurement above was, if anything,
      # generous to the higher numbers: Postgres ran outside the CPU budget.
      #
      # Each worker gets its OWN database (`kprueck_test_gw0`, …), created and dropped by
      # backend/tests/conftest.py. Concurrent workers on one database is how a reliable suite
      # becomes a flaky one, and a flaky suite is worse than a slow one. `-n` is deliberately
      # not in addopts: plain `uv run pytest` still runs serially against the single database.
      #
      # `-v` is gone: with three workers interleaving output it printed 1881 lines in a
      # meaningless order. The failure summary is what anyone reads anyway.
      #
      # By 2026-10-06 the suite had grown to 3457 tests and this step took ~350s again. About
      # half of that was bcrypt: every editor/admin fixture hashed its password at the
      # production cost (12, ~250 ms) and every fixture login checked it again. The suite now
      # hashes at cost 4 (tests/conftest.py); what the app asks for is pinned by
      # tests/test_auth/test_security.py::test_hash_password_asks_for_cost_12.
      #
      # pytest-cov combines the per-worker coverage data itself, so --cov-fail-under still
      # measures the whole suite. The floor sits just under the real figure (88% on
      # 2026-10-08): it used to be 35, which allowed the suite to lose more than half its
      # coverage without anything turning red.
      - name: Run tests with coverage
        run: uv run pytest -n 3 --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=87
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck_test
          # Explicit rather than relying on the conftest default. Every database the suite
          # touches — the per-worker ones and the migration-drift scratch database — is
          # derived from THIS url, so it is the single knob for pointing the suite elsewhere.
          TEST_DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck_test
          SECRET_KEY: ci-test-secret-key-not-for-production-use-1234567890

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          # `files` (plural). v7 dropped the old singular `file`, which it had been silently
          # ignoring while warning in the log — so the upload was going up with no report
          # attached. Nothing about the job turned red, which is exactly why it survived.
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # Frontend Quality Checks
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint` is ESLint plus a PER-RULE warning ratchet (frontend/scripts/lint-ratchet.mjs).
      # The allowed numbers live in ONE place, frontend/eslint-ratchet.json — not here, not in
      # package.json. Until 2026-10-08 a single `--max-warnings 17` sat in package.json while
      # this step's message said «currently 26» and the tree had 13: three numbers, none
      # binding, and four warnings of slack anyone could spend.
      #
      # A rule may not go above its number, a rule not in the file may have none, and a rule
      # that dropped below its number fails too until `pnpm lint --tighten` writes the lower
      # count — so a fixed warning cannot quietly come back. The script prints the per-rule
      # counts and says which of those cases it is; raising a number is never the fix.
      - name: Run ESLint
        run: pnpm lint

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (Vitest)
        run: pnpm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      # GitHub Pages serves site/ verbatim, so the generated pages are committed.
      # This fails if index.html / fr/index.html are behind the template or the
      # texts – otherwise the site in the repo stops being the site on the web.
      # Plain node, no install: build.mjs has no dependencies.
      - name: Landing page is built from its sources
        working-directory: ${{ github.workspace }}
        run: node site/build.mjs --check

  # ============================================
  # E2E — the @smoke subset only.
  #
  # The full suite is ~300 specs at ~25 minutes and flaky enough that a red result had stopped
  # carrying information, so it stayed switched off entirely and CI covered no click-through at
  # all. This runs the eight specs on the paths where a break is both plausible and expensive:
  # log in, land on the board, create an event, select it, create an incident, and alarm intake
  # in and out. Tag more with `{ tag: '@smoke' }` as they prove stable.
  #
  # REQUIRED ON MAIN since 2026-08-21. It was deliberately held out until it had been green
  # across runs it did not deserve to be, and it has: repeated PR and push runs plus the 0.7.0
  # merge, all green, alongside a nightly that has been green for a week. The 0.7.0 cycle is
  # the argument for it, since the merge to main
  # was the first time any gate had seen 83 commits and three of these specs were describing
  # flows the app no longer had.
  #
  # A red result here now blocks a merge. If it turns flaky rather than wrong, take the spec
  # out of @smoke — do not take the job out of branch protection.
  #
  # The full suite stays a human step before a release and after touching auth, the board or
  # alarm intake: `cd frontend && pnpm test:e2e` (needs `just dev`). e2e-nightly.yml runs it on
  # a schedule.
  # ============================================
  e2e-smoke:
    name: E2E (@smoke)
    runs-on: ubuntu-latest
    # The whole point is a fast signal; if it is not fast it is not doing its job.
    timeout-minutes: 15
    # No `needs:`. It used to wait for backend-test and frontend-build, but it consumes
    # nothing they produce (it runs its own backend and `pnpm dev`), so the wait only made the
    # gate serial: ~6.5 min of backend tests, THEN ~3 min of this, on every run. In parallel
    # the gate's wall clock is its slowest job, not the sum of two. A red backend test now
    # costs one extra E2E run of runner time — cheap next to everyone waiting three minutes.

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Python
        working-directory: backend
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # ADMIN_SEED_PASSWORD has to be set and has to match what the specs log in with.
      # Without it the seed mints a RANDOM development password, and every spec fails at the
      # login screen — one of the reasons this job could not simply be switched back on.
      # No ENVIRONMENT=production here on purpose: the specs need the dev fixture board
      # (vehicles, personnel, materials), which a production seed deliberately omits.
      # The seed writes rows; it does not create the schema. This service container is a bare
      # postgres, so without the migrations the very first INSERT dies on `relation "users"
      # does not exist`. The other jobs never needed this — pytest builds its own schema and
      # the images job migrates inside the container — which is why the gap only shows here.
      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck

      - name: Seed database
        working-directory: backend
        run: uv run python -m app.seed
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          ADMIN_SEED_PASSWORD: ${{ env.E2E_PASSWORD }}
          VIEWER_PASSWORD: ${{ env.E2E_PASSWORD }}

      - name: Start backend server
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          CORS_ORIGINS: http://localhost:3000

      # A quarantined spec (`@quarantine-until-YYYY-MM-DD`, see e2e-nightly.yml) is out of the
      # gate. Only the tag's FORMAT is checked here; its expiry fails the nightly instead, so a
      # date passing can never turn an unrelated pull request red.
      - name: Quarantine tags are well-formed
        working-directory: frontend
        run: node scripts/e2e-quarantine.mjs --format-only

      - name: Run E2E tests (@smoke)
        working-directory: frontend
        run: pnpm exec playwright test --grep @smoke --grep-invert @quarantine
        env:
          TEST_USERNAME: admin
          TEST_PASSWORD: ${{ env.E2E_PASSWORD }}
          # No @smoke spec logs in as the viewer today, so this is prophylactic: tagging one
          # later must not silently reproduce the nightly's failure, where the missing variable
          # sends the specs to the dev default in tests/constants.ts and every viewer login
          # times out at the login screen.
          VIEWER_PASSWORD: ${{ env.E2E_PASSWORD }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # Visual — screenshot regression on frozen states (docs/VISUAL_TESTS.md).
  #
  # Nine screens (board desktop dark/light/detail, board phone, /feld, the Lagekarte, the wall
  # board and status, settings) rendered from a production build against `app.seed_visual` —
  # the demo storm evening pinned to one instant, with the browser clock frozen at the same
  # instant and every foreign request stubbed — and compared with the PNGs committed in
  # frontend/tests/visual/__screenshots__/. It exists because a merged visual pass can be lost
  # in a later rebuild without a single test noticing.
  #
  # NOT in the required list yet: same probation e2e-smoke had — make it required once it has
  # been green on every run for a couple of weeks. A red result here means «the screen changed»:
  # look at the diff (artifact `visual-diff`, the table in the job summary). If the change is
  # deliberate, regenerate the baselines with visual-baselines.yml and commit them on their own
  # — never to turn this check green.
  #
  # No `needs:` and not on the critical path: it builds its own frontend and runs its own
  # backend, in parallel with everything else.
  # ============================================
  visual:
    name: Visual (screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # -alpine, as production runs it: the image's collation decides the order of names the
        # backend sorts, which is on screen (scripts/visual-test.sh).
        image: public.ecr.aws/docker/library/postgres:16-alpine
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Python
        working-directory: backend
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Next's own build cache: an incremental `next build` instead of a cold one. Keyed per
      # commit, restored from the newest entry for the same lockfile.
      - name: Next.js build cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-visual-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-visual-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}-

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # Build, migrate + seed the service database, start both servers, run the specs, stop.
      # The same script as `just visual`; CI=true makes a missing baseline a failure instead
      # of a write.
      - name: Compare the screenshots
        run: bash scripts/visual-test.sh
        env:
          VISUAL_DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          CI: true

      - name: Summarise
        if: always()
        working-directory: frontend
        run: node scripts/visual-summary.mjs test-results/visual-report.json >> "$GITHUB_STEP_SUMMARY"

      # expected / actual / diff per state that differed, plus the html report that shows them
      # side by side (and as a slider).
      - name: Upload the diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

  # ============================================
  # Images: build all four, boot the production stack, smoke it
  # ============================================
  # This is the job that makes a published release trustworthy: it builds the SAME images
  # release.yml pushes, boots them through docker-compose.yml exactly as a self-hoster would,
  # and proves the one thing that can't be unit-tested — that the four containers can talk to
  # each other behind Caddy on a single origin.
  images:
    name: Images (build + boot + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The Dockerfiles name their bases on Docker Hub (so Dependabot can read them), and Hub
          # answers anonymous pulls past its rate limit with 429 — even the manifest HEAD
          # (09.10.2026). BuildKit asks Google's Hub mirror first (same digests) and falls back
          # to Hub itself.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
          # Buildx's own BuildKit container is moby/buildkit from Docker Hub unless named here, and
          # Hub's anonymous pull limit failed this step at random (09.10.2026). Same mirror, same digest.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      - name: Write .env (compose reads it before anything else)
        run: |
          {
            echo "POSTGRES_PASSWORD=ci_test_password"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "AUTH_SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_SEED_PASSWORD=$(openssl rand -hex 16)"
            echo "VIEWER_PASSWORD=$(openssl rand -hex 16)"
            echo "HTTP_PORT=8080"
            echo "PUBLIC_URL=http://localhost:8080"
            # compose pulls ghcr.io/…:${KP_RUECK_TAG:-latest}; point it at the images built
            # below so the stack boots THIS commit instead of the last published release.
            echo "KP_RUECK_TAG=ci"
          } > .env

      - name: Validate compose config
        run: docker compose config -q

      - name: Seed synthetic private files to exercise image exclusions
        run: |
          mkdir -p backend/data/photos backend/backups
          printf 'synthetic upload, never ship\n' > backend/data/photos/image-exclusion-sentinel.jpg
          printf 'synthetic backup, never ship\n' > backend/backups/image-exclusion-sentinel.dump
          printf 'synthetic environment, never ship\n' > backend/.env.production

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Verify backend image excludes private runtime files
        run: |
          docker run --rm --entrypoint sh ghcr.io/feuerwehr-oberwil/kp-rueck-backend:ci -ec '
            test ! -e /app/data/photos/image-exclusion-sentinel.jpg
            test ! -e /app/backups/image-exclusion-sentinel.dump
            test ! -e /app/.env.production
          '

      # Built WITHOUT NEXT_PUBLIC_API_URL on purpose: the published image must not carry any
      # one station's API URL. The browser calls /backend-api on its own origin instead.
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runner
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-frontend:ci
          cache-from: type=gha,scope=frontend
          # Exported from main only. A pull request's cache entry is scoped to its own ref, so
          # nothing but later pushes to that PR could ever read it — and its builder layer
          # changes with every commit anyway. Exporting took ~22s of this job on every PR run;
          # PRs still READ main's cache, which is where the reusable pnpm-install layer is.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=frontend' || '' }}

      - name: Build tileserver image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tileserver/Dockerfile
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-tileserver:ci
          cache-from: type=gha,scope=tileserver
          cache-to: type=gha,mode=max,scope=tileserver

      # Not booted (it needs a printer on the LAN), but built so a broken Dockerfile can't
      # reach a release.
      - name: Build print-agent image
        uses: docker/build-push-action@v7
        with:
          context: ./tools/print-agent
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-print-agent:ci
          cache-from: type=gha,scope=print-agent
          cache-to: type=gha,mode=max,scope=print-agent

      # ECR Public serves an anonymous client about one pull per second and answered compose's
      # parallel pulls (db + caddy) with «toomanyrequests: Rate exceeded». One at a time, retried.
      - name: Pull the stack's registry images (one at a time, retried)
        run: |
          for img in $(docker compose config --images | grep -v '^ghcr.io/feuerwehr-oberwil/'); do
            for i in 1 2 3 4 5; do
              docker pull -q "$img" && break
              [ "$i" = 5 ] && exit 1
              sleep $((i * 5))
            done
          done

      - name: Boot the stack
        run: docker compose up -d --wait   # waits for db/backend/frontend/tileserver health

      - name: Smoke test (everything through the single origin)
        run: |
          set -euo pipefail
          # Backend, routed by Caddy.
          curl -fsS http://localhost:8080/health
          # Backend through the Next.js proxy — the path a browser takes when the image
          # carries no baked-in API URL. This is the whole generic-image premise.
          curl -fsSL http://localhost:8080/backend-api/health
          # This app does not use Next image optimization. Keep its decoder endpoint closed.
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8080/_next/image?url=%2Ffavicon.ico&w=64&q=75')
          test "$code" = "404" || { echo "image optimizer unexpectedly enabled: HTTP $code"; exit 1; }
          # The app itself renders. Written to a file first: `curl | grep -q` exits on the
          # first match, curl dies of SIGPIPE, and pipefail turns a PASS into a failure.
          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -qi "<html" /tmp/index.html || { echo "frontend did not render"; exit 1; }
          # Offline tiles reachable on the same origin.
          curl -fsS http://localhost:8080/tiles/health
          # Log in as the seeded admin and reuse the cookie: proves auth, the DB, first-boot
          # seeding and the cookie flags all work through the single origin — the path every
          # operator takes, and the one a broken deployment fails at.
          admin_pw=$(grep '^ADMIN_SEED_PASSWORD=' .env | cut -d= -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/cookies.txt \
            -X POST http://localhost:8080/api/auth/login \
            -d "username=admin&password=${admin_pw}")
          test "$code" = "200" || { echo "login failed: HTTP $code"; exit 1; }
          curl -fsS -b /tmp/cookies.txt http://localhost:8080/api/auth/me > /dev/null
          echo "stack smoke OK"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
