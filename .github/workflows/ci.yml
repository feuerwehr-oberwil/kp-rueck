name: CI

# CI Strategy:
# - BLOCKING: backend-test, frontend-typecheck, frontend-unit-tests, frontend-build
# - NON-BLOCKING (TODO): backend-lint (87 errors), backend-typecheck (mypy),
#                        backend-security (bandit), frontend-lint (158 errors)
# - E2E: Only runs on main branch after blocking checks pass
# - Coverage: Min 35% (target: 50% → 70%)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this whole gate against the tag before publishing images.
  workflow_call:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ============================================
  # Backend Quality Checks
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .
        continue-on-error: true  # TODO: Fix formatting issues then make blocking

      - name: Lint with Ruff
        run: uv run ruff check .
        continue-on-error: true  # TODO: Fix 87 lint errors then make blocking

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Type check with mypy
        run: uv run mypy app --ignore-missing-imports
        continue-on-error: true  # TODO: Make blocking once type errors are fixed

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: uv tool install bandit

      - name: Security scan with Bandit
        run: uv tool run bandit -r app -ll -ii -x app/tests
        continue-on-error: true  # TODO: Make blocking once security issues are reviewed

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U kprueck; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=35 -v
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck_test
          SECRET_KEY: ci-test-secret-key-not-for-production-use-1234567890

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # Frontend Quality Checks
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint
        continue-on-error: true  # TODO: Fix 158 lint errors then make blocking

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (Vitest)
        run: pnpm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ============================================
  # E2E Tests - disabled in CI (run locally with: cd frontend && pnpm test:e2e)
  # Playwright tests are too slow/flaky for CI (~25min with 300 tests)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: false  # Disabled - run locally
    needs: [backend-test, frontend-build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Python
        working-directory: backend
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed database
        working-directory: backend
        run: uv run python -m app.seed
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck

      - name: Start backend server
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          CORS_ORIGINS: http://localhost:3000

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # Images: build all four, boot the production stack, smoke it
  # ============================================
  # This is the job that makes a published release trustworthy: it builds the SAME images
  # release.yml pushes, boots them through docker-compose.yml exactly as a self-hoster would,
  # and proves the one thing that can't be unit-tested — that the four containers can talk to
  # each other behind Caddy on a single origin.
  images:
    name: Images (build + boot + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write .env (compose reads it before anything else)
        run: |
          {
            echo "POSTGRES_PASSWORD=ci_test_password"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "AUTH_SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_SEED_PASSWORD=$(openssl rand -hex 16)"
            echo "VIEWER_PASSWORD=$(openssl rand -hex 16)"
            echo "HTTP_PORT=8080"
            echo "PUBLIC_URL=http://localhost:8080"
            # compose pulls ghcr.io/…:${KP_RUECK_TAG:-latest}; point it at the images built
            # below so the stack boots THIS commit instead of the last published release.
            echo "KP_RUECK_TAG=ci"
          } > .env

      - name: Validate compose config
        run: docker compose config -q

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Built WITHOUT NEXT_PUBLIC_API_URL on purpose: the published image must not carry any
      # one station's API URL. The browser calls /backend-api on its own origin instead.
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runner
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build tileserver image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./tileserver/Dockerfile
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-tileserver:ci
          cache-from: type=gha,scope=tileserver
          cache-to: type=gha,mode=max,scope=tileserver

      # Not booted (it needs a printer on the LAN), but built so a broken Dockerfile can't
      # reach a release.
      - name: Build print-agent image
        uses: docker/build-push-action@v6
        with:
          context: ./print-agent
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-print-agent:ci
          cache-from: type=gha,scope=print-agent
          cache-to: type=gha,mode=max,scope=print-agent

      - name: Boot the stack
        run: docker compose up -d --wait   # waits for db/backend/frontend/tileserver health

      - name: Smoke test (everything through the single origin)
        run: |
          set -euo pipefail
          # Backend, routed by Caddy.
          curl -fsS http://localhost:8080/health
          # Backend through the Next.js proxy — the path a browser takes when the image
          # carries no baked-in API URL. This is the whole generic-image premise.
          curl -fsSL http://localhost:8080/backend-api/health
          # The app itself renders. Written to a file first: `curl | grep -q` exits on the
          # first match, curl dies of SIGPIPE, and pipefail turns a PASS into a failure.
          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -qi "<html" /tmp/index.html || { echo "frontend did not render"; exit 1; }
          # Offline tiles reachable on the same origin.
          curl -fsS http://localhost:8080/tiles/health
          # Log in as the seeded admin and reuse the cookie: proves auth, the DB, first-boot
          # seeding and the cookie flags all work through the single origin — the path every
          # operator takes, and the one a broken deployment fails at.
          admin_pw=$(grep '^ADMIN_SEED_PASSWORD=' .env | cut -d= -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/cookies.txt \
            -X POST http://localhost:8080/api/auth/login \
            -d "username=admin&password=${admin_pw}")
          test "$code" = "200" || { echo "login failed: HTTP $code"; exit 1; }
          curl -fsS -b /tmp/cookies.txt http://localhost:8080/api/auth/me > /dev/null
          echo "stack smoke OK"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
