name: CI

# CI strategy – keep this comment truthful, it is the only place the split is written down.
#
# BLOCKING (a red one of these must stop a merge; these are the checks required on main):
#   backend-lint, backend-test, frontend-lint, frontend-typecheck, frontend-unit-tests,
#   frontend-build, images
#
# ADVISORY (runs, reports, never fails the build) – with the real numbers as of 2026-07-25,
# so nobody has to guess how far off "make it blocking" is:
#   backend-typecheck  mypy    – 757 errors in 87 files. A real project, not a cleanup.
#   backend-security   bandit  – 52 findings (45 high-confidence). Needs triage before it can
#                                gate anything; most are expected patterns in test/dev paths.
# Both stay advisory deliberately: a check that is always red teaches people to ignore red.
#
# DISABLED:
#   e2e – `if: false`. Playwright runs locally (`just test`), not in CI. It is kept here so it
#         can be switched back on, and it is NOT in the required-checks list on main, because a
#         permanently skipped required check blocks every pull request.
#
# Coverage: min 35% (target: 50% → 70%).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this whole gate against the tag before publishing images.
  workflow_call:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  # ============================================
  # Backend Quality Checks
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      # Blocking for the modules that are clean, advisory for the rest. Splitting it this way
      # is the point: one gate over the whole tree could only ever be advisory (there are
      # ~690 findings left, see docs/plans/14-typing-debt.md), and an advisory gate is one
      # nobody reads. These paths are at zero and must stay there.
      - name: Type check with mypy (blocking subset)
        run: uv run mypy app/auth app/middleware app/schemas app/services/alerting --ignore-missing-imports

      # The rest, as a report. Moving a package out of here and into the step above is the
      # unit of progress — don't widen the blocking list without getting it to zero first.
      - name: Type check with mypy (rest, advisory)
        run: uv run mypy app --ignore-missing-imports
        continue-on-error: true

  # The print agent is not part of the backend: it runs on a box in the station, speaks to
  # BOTH KP Front and KP Rück, and its core is deliberately dependency-free. So it gets its
  # own job with a plain Python — which is also what proves the bare-Pi install path, since
  # the run would fail here if anything in the core started needing a package.
  print-agent:
    name: Print Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/print-agent

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tests (stub backends + fake lp/lpstat, no printer needed)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: uv tool install bandit

      # Blocking. It was advisory while one finding was outstanding; that finding was reviewed
      # (B104 in config.py — does not apply to a containerised service) and annotated, so the
      # scan is clean and a NEW medium-or-worse finding must now be dealt with rather than
      # scrolled past. Annotate a false positive at the line with `# nosec BXXX` and a reason.
      - name: Security scan with Bandit
        run: uv tool run bandit -r app -ll -ii -x app/tests

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U kprueck; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=35 -v
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck_test
          SECRET_KEY: ci-test-secret-key-not-for-production-use-1234567890

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # Frontend Quality Checks
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (Vitest)
        run: pnpm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ============================================
  # E2E Tests — DELIBERATELY OFF, not broken. ~300 Playwright specs at ~25 min per run, and
  # flaky enough that a red result had stopped carrying information. Gating merges on a suite
  # nobody trusts is worse than not gating: it teaches people to click through the failure.
  #
  # The consequence is that CI does NOT cover a full click-through, so running the suite is a
  # human step: `cd frontend && pnpm test:e2e` (needs `just dev`) before a release, and after
  # touching auth, the board or alarm intake. CONTRIBUTING.md says the same in the place a
  # contributor will look. Note kp-front DOES run Playwright blocking — no parity between repos.
  #
  # Bringing it back = docs/plans/15-e2e-in-ci.md: measure what is actually slow and actually
  # flaky, tag a <25-spec @smoke subset that runs blocking in under five minutes, full suite
  # nightly. Deleting `if: false` without that work just re-creates the ignored red job.
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: false  # Disabled - run locally
    needs: [backend-test, frontend-build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Python
        working-directory: backend
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed database
        working-directory: backend
        run: uv run python -m app.seed
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck

      - name: Start backend server
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          CORS_ORIGINS: http://localhost:3000

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # Images: build all four, boot the production stack, smoke it
  # ============================================
  # This is the job that makes a published release trustworthy: it builds the SAME images
  # release.yml pushes, boots them through docker-compose.yml exactly as a self-hoster would,
  # and proves the one thing that can't be unit-tested — that the four containers can talk to
  # each other behind Caddy on a single origin.
  images:
    name: Images (build + boot + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write .env (compose reads it before anything else)
        run: |
          {
            echo "POSTGRES_PASSWORD=ci_test_password"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "AUTH_SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_SEED_PASSWORD=$(openssl rand -hex 16)"
            echo "VIEWER_PASSWORD=$(openssl rand -hex 16)"
            echo "HTTP_PORT=8080"
            echo "PUBLIC_URL=http://localhost:8080"
            # compose pulls ghcr.io/…:${KP_RUECK_TAG:-latest}; point it at the images built
            # below so the stack boots THIS commit instead of the last published release.
            echo "KP_RUECK_TAG=ci"
          } > .env

      - name: Validate compose config
        run: docker compose config -q

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Built WITHOUT NEXT_PUBLIC_API_URL on purpose: the published image must not carry any
      # one station's API URL. The browser calls /backend-api on its own origin instead.
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runner
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build tileserver image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tileserver/Dockerfile
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-tileserver:ci
          cache-from: type=gha,scope=tileserver
          cache-to: type=gha,mode=max,scope=tileserver

      # Not booted (it needs a printer on the LAN), but built so a broken Dockerfile can't
      # reach a release.
      - name: Build print-agent image
        uses: docker/build-push-action@v7
        with:
          context: ./print-agent
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-print-agent:ci
          cache-from: type=gha,scope=print-agent
          cache-to: type=gha,mode=max,scope=print-agent

      - name: Boot the stack
        run: docker compose up -d --wait   # waits for db/backend/frontend/tileserver health

      - name: Smoke test (everything through the single origin)
        run: |
          set -euo pipefail
          # Backend, routed by Caddy.
          curl -fsS http://localhost:8080/health
          # Backend through the Next.js proxy — the path a browser takes when the image
          # carries no baked-in API URL. This is the whole generic-image premise.
          curl -fsSL http://localhost:8080/backend-api/health
          # The app itself renders. Written to a file first: `curl | grep -q` exits on the
          # first match, curl dies of SIGPIPE, and pipefail turns a PASS into a failure.
          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -qi "<html" /tmp/index.html || { echo "frontend did not render"; exit 1; }
          # Offline tiles reachable on the same origin.
          curl -fsS http://localhost:8080/tiles/health
          # Log in as the seeded admin and reuse the cookie: proves auth, the DB, first-boot
          # seeding and the cookie flags all work through the single origin — the path every
          # operator takes, and the one a broken deployment fails at.
          admin_pw=$(grep '^ADMIN_SEED_PASSWORD=' .env | cut -d= -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/cookies.txt \
            -X POST http://localhost:8080/api/auth/login \
            -d "username=admin&password=${admin_pw}")
          test "$code" = "200" || { echo "login failed: HTTP $code"; exit 1; }
          curl -fsS -b /tmp/cookies.txt http://localhost:8080/api/auth/me > /dev/null
          echo "stack smoke OK"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
