name: CI

# CI strategy – keep this comment truthful, it is the only place the split is written down.
#
# BLOCKING (a red one of these must stop a merge; these are the checks required on main):
#   secrets, backend-lint, backend-test, backend-security, print-agent, frontend-lint,
#   frontend-typecheck, frontend-unit-tests, frontend-build, images, e2e-smoke
#   plus backend-typecheck's FIRST step (mypy over the packages that are at zero)
#   plus telemetry-drift, alarm-keyword-drift, roster-schema-drift and alarm-contract-drift —
#   the ONLY checks that compare anything against kp-front; the in-repo hash tests cannot see
#   the other repository.
#   All four are held out of the required list on main until they have run a few times,
#   because all four depend on a sibling repo being reachable. They are separate jobs on
#   purpose, because they answer different questions: "could one app leak what the other
#   strips", "could the two classify an alarm differently", "could a station's roster
#   snapshot be valid for one product and refused by the other", and "could one dispatch
#   webhook be accepted by one app and refused by the other".
#   All read `env.SIBLING_REPO` and SKIP (never fail) when it is empty or cannot be checked
#   out, so a fork inherits an honest "not checked" rather than a red X against a repository
#   it has nothing to do with. They still fail on real drift for the upstream pair.
#
# ADVISORY (runs, reports, never fails the build) – with the real numbers as of 2026-07-30:
#   backend-typecheck  mypy, second step – 55 errors in 7 files across the packages NOT in the
#                      blocking subset (was 711 in 79). app/crud, app/background,
#                      websocket_manager.py, models.py, traccar.py, app/api and — since
#                      2026-07-30 — app/services have all been cleared and moved into the
#                      blocking step. What is left is the seed scripts (46), app/telemetry (14,
#                      excluded deliberately: vendored byte-identical with kp-front and pinned
#                      by checksum) and app/main (3). The advisory step is now nearly empty,
#                      and the remainder is either out of scope on purpose or run-once-by-hand.
#   codecov upload   – never worth failing a build over.
#
# bandit used to be here too, at "52 findings". That number was misleading: with the `-ll -ii`
# threshold the run reported exactly ONE medium finding (B104, which does not apply to a
# containerised service). It was reviewed, annotated at the line, and the gate is now blocking.
# The rest sit below the threshold and were never reported.
#
# The rule behind the split: a check that is always red teaches people to ignore red. Either a
# gate is at zero and blocks, or it is honestly labelled a report.
#
# NOT A MERGE GATE, but not optional either:
#   CodeQL – cross-file taint tracking, reporting into the Security tab per PR and weekly.
#            It runs from GitHub's DEFAULT setup (repo settings → Code security), not from a
#            workflow file in this repo, and it covers five languages there: actions,
#            javascript, javascript-typescript, python, typescript.
#            Do NOT add a `codeql.yml`: with default setup enabled, GitHub rejects the SARIF
#            an advanced workflow uploads, so the job fails while the real analysis passes
#            beside it. (kp-front is the other way round — default setup is off there, so it
#            needs its workflow file. Same coverage, different mechanism.)
#
# RUNS ON ITS OWN SCHEDULE, in restore-drill.yml:
#   restore-drill – seed, dump with scripts/backup.sh, restore into a FRESH empty database, diff
#         the row counts and real values, and check the restored database still migrates forward.
#         Weekly, plus on any PR that touches scripts/backup.sh, scripts/restore.sh,
#         backend/start.sh or a migration. It is the standing answer to "has anyone ever actually
#         restored one of these?" — the same reasoning as telemetry-drift. It runs Postgres 17
#         (production), not the 16 that docker-compose.yml pins.
#
# REQUIRED SINCE 2026-08-21 (plan 15's last open item):
#   e2e-smoke – the @smoke-tagged Playwright specs on the core path. It used to be `if: false`
#         and covered nothing; it was then held out of the required list until it had proved
#         stable across real runs, and since 2026-08-21 it IS required on main (plan 15's last
#         open item). The full ~300-spec suite is a human step (`cd frontend && pnpm test:e2e`,
#         with `AUTH_BYPASS_AUTH_DEV=false` or the role assertions mean nothing) plus the
#         nightly schedule in e2e-nightly.yml.
#
# Coverage: min 35% (target: 50% → 70%).

on:
  push:
    # `develop` is here because leaving it out cost a whole cycle: 83 commits accumulated
    # there with nothing running the gate, and the merge to main was going to be the first
    # time anything type-checked the backend or ran a test in CI. It found 22 mypy errors
    # and three stale E2E specs, none of which are expensive to fix on the day they are
    # written and all of which are a bad surprise on release day.
    branches: [main, develop]
  pull_request:
    branches: [main]
  # release.yml runs this whole gate against the tag before publishing images.
  workflow_call:

env:
  # The sibling product both cross-repo drift jobs compare against (telemetry-drift,
  # alarm-keyword-drift). THE ONE LINE A FORK CHANGES: point it at your own kp-front fork to
  # keep the checks meaningful, or set it to "" to switch them off — they then SKIP with a
  # message instead of failing you against upstream's files. Kept out of the jobs so there is
  # exactly one place to edit, and no ownership check hidden in an `if:` somewhere else.
  SIBLING_REPO: "feuerwehr-oberwil/kp-front"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"   # Active LTS; 20 went EOL 2026-04-30. Match frontend/Dockerfile.
  PNPM_VERSION: "9"
  # Seeds the throwaway E2E database and is what the specs log in with. Not a secret — the
  # database and the container both die with the job — but it must be >= 12 chars, and the
  # seed step and the specs must read the SAME value or every spec fails at the login screen.
  E2E_PASSWORD: "e2e-ci-password-not-a-secret"  # gitleaks:allow

jobs:
  # ============================================
  # Secrets
  # ============================================
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CLI via container (not gitleaks-action, which needs a license key for org repos).
      # Scans exactly the TRACKED tree at HEAD (git archive), so a contributor's local .env
      # and node_modules never enter the picture. Deliberate test values carry inline
      # `gitleaks:allow` comments — the CI .env in the images job is generated at runtime
      # with openssl, so there is nothing to allow there.
      - name: Scan tracked tree for secrets
        run: |
          mkdir -p /tmp/scan
          git archive HEAD | tar -x -C /tmp/scan
          docker run --rm -v /tmp/scan:/repo zricethezav/gitleaks:latest \
            detect --source /repo --no-git --redact --exit-code 1

  # ============================================
  # Backend Quality Checks
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      # Blocking for the modules that are clean, advisory for the rest. Splitting it this way
      # is the point: one gate over the whole tree could only ever be advisory, and an
      # advisory gate is one nobody reads.
      # These paths are at zero and must stay there.
      #
      # `app/services` joined on 2026-07-30 (183 -> 0), which leaves only 55 findings in the
      # advisory step: the seed scripts (46), `app/telemetry` (14, excluded on purpose — it is
      # vendored byte-identical with kp-front and pinned by checksum) and `app/main` (3).
      # In other words the advisory step is now almost empty, and what remains is either
      # deliberately out of scope or run-once-by-hand code.
      - name: Type check with mypy (blocking subset)
        run: >-
          uv run mypy
          app/auth app/middleware app/schemas app/services
          app/crud app/background app/api
          app/websocket_manager.py app/models.py app/traccar.py
          --ignore-missing-imports

      # The rest, as a report. Moving a package out of here and into the step above is the
      # unit of progress — don't widen the blocking list without getting it to zero first.
      - name: Type check with mypy (rest, advisory)
        run: uv run mypy app --ignore-missing-imports
        continue-on-error: true

  # The print agent is not part of the backend: it runs on a box in the station, speaks to
  # BOTH KP Front and KP Rück, and its core is deliberately dependency-free. So it gets its
  # own job with a plain Python — which is also what proves the bare-Pi install path, since
  # the run would fail here if anything in the core started needing a package.
  print-agent:
    name: Print Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/print-agent

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tests (stub backends + fake lp/lpstat, no printer needed)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

  # ── The two cross-repository drift jobs ──────────────────────────────────────────────────
  #
  # FORKS, READ THIS FIRST. Both jobs below compare files in THIS repository against the same
  # files in KP Front. Which KP Front is `env.SIBLING_REPO`, at the top of this file — that is
  # the ONE line a fork changes. Point it at your own kp-front fork to keep the check, or set
  # it to an empty string to switch both jobs off; they then skip with a message instead of
  # failing you against somebody else's file. Nothing else in this file needs touching.
  #
  # They do NOT skip when the sibling is reachable and the files differ. That is the whole
  # point: a check that goes green when it could not answer the question is worse than no
  # check, because a green tick reads as proof.
  #
  # The vendored telemetry modules are shared with kp-front by COPY, not by package. The
  # in-repo test hashes them against a recorded literal, which catches an accidental edit here
  # — but not the case the docstring actually warns about: change scrub.py in one repo, update
  # that repo's own literal, and BOTH suites stay green while the two sanitisers diverge. One
  # of them then strips something the other leaks.
  #
  # So this job is the only thing that ever compares the two repositories. kp-front is public,
  # so no token is needed. It runs on the default branch of the sibling, which is what a
  # station actually deploys — pinning a ref would compare against something nobody runs.
  telemetry-drift:
    name: Telemetry sanitiser matches KP Front
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # `continue-on-error` so an unreachable/private/renamed sibling becomes a SKIP below
      # rather than a red X nobody can act on. A fork that never sets SIBLING_REPO lands here.
      - name: Check out the sibling repository
        id: sibling
        if: env.SIBLING_REPO != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SIBLING_REPO }}
          path: .kp-front
          fetch-depth: 1

      - name: Diff the vendored telemetry modules
        env:
          SIBLING_STATUS: ${{ steps.sibling.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${SIBLING_REPO:-}" ]; then
            echo "::notice::SIBLING_REPO is empty — cross-repo telemetry check disabled for this fork."
            exit 0
          fi
          if [ "$SIBLING_STATUS" != "success" ]; then
            echo "::notice::Could not check out ${SIBLING_REPO} (private, renamed or unreachable)."
            echo "::notice::Skipping the telemetry drift check. Set SIBLING_REPO in .github/workflows/ci.yml"
            echo "::notice::to a repository this workflow can read, or to '' to switch it off."
            exit 0
          fi
          # consent.py and dsn.py are deliberately NOT here: the first talks to whatever table
          # each app keeps deployment state in, the second holds the app's own ingest project.
          files="scrub.py envelope.py outbox.py forwarder.py __init__.py"
          status=0
          for f in $files; do
            ours="backend/app/telemetry/$f"
            theirs=".kp-front/backend/app/telemetry/$f"
            if [ ! -f "$theirs" ]; then
              echo "::error::$f is missing in ${SIBLING_REPO} — the vendored set has changed shape"
              status=1
              continue
            fi
            if ! diff -u "$theirs" "$ours" > "/tmp/$f.diff"; then
              echo "::error::app/telemetry/$f has diverged from ${SIBLING_REPO}"
              cat "/tmp/$f.diff"
              status=1
            else
              echo "  ✓ $f"
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Copy the changed file across, run BOTH test suites, and update the recorded"
            echo "hash in both repositories in the same change. Updating one side alone is"
            echo "exactly the failure this job exists to catch."
            echo ""
            echo "If this is a fork that MEANS to differ, point SIBLING_REPO at your own"
            echo "kp-front fork in .github/workflows/ci.yml, or set it to '' to switch this off."
            exit 1
          fi

  # Same mechanism, second shared thing: the alarm keyword vocabulary. Both products read the
  # same dispatch system and had grown the same two tables by hand — 19 title keywords, 41
  # priority keywords — with nothing comparing them, which is how GASLECK ended up on one side
  # only. The in-repo test pins the checksums; this job is the only thing that reads kp-front.
  #
  # Kept as its OWN job rather than a step in telemetry-drift on purpose: a failure here means
  # "an alarm may be classified differently in the two apps", a failure there means "one app may
  # leak what the other strips". Different questions, different urgency — a shared red X would
  # tell you neither.
  #
  # It pins the SHIPPED vocabulary only. A deployment that brings its own words does so in its
  # own config (kp-front: `alarmKeywords`), which is deployment data — never checksummed, never
  # compared against anything. This job would otherwise be exactly the lock-in the override
  # exists to remove.
  alarm-keyword-drift:
    name: Alarm keyword vocabulary matches KP Front
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out the sibling repository
        id: sibling
        if: env.SIBLING_REPO != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SIBLING_REPO }}
          path: .kp-front
          fetch-depth: 1

      - name: Diff the shared keyword vocabulary
        env:
          SIBLING_STATUS: ${{ steps.sibling.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${SIBLING_REPO:-}" ]; then
            echo "::notice::SIBLING_REPO is empty — cross-repo vocabulary check disabled for this fork."
            exit 0
          fi
          if [ "$SIBLING_STATUS" != "success" ]; then
            echo "::notice::Could not check out ${SIBLING_REPO} (private, renamed or unreachable)."
            echo "::notice::Skipping the alarm vocabulary drift check. Set SIBLING_REPO in"
            echo "::notice::.github/workflows/ci.yml to a repository this workflow can read, or to ''."
            exit 0
          fi
          # The JSON is the vocabulary; the loader is how both sides read it. Pinning one
          # without the other would leave half the contract free to move.
          files="alarm_keywords.py data/alarm_keywords.json"
          status=0
          for f in $files; do
            ours="backend/app/$f"
            theirs=".kp-front/backend/app/$f"
            if [ ! -f "$theirs" ]; then
              echo "::error::$f is missing in ${SIBLING_REPO} — the shared vocabulary has changed shape"
              status=1
              continue
            fi
            if ! diff -u "$theirs" "$ours" > "/tmp/kw-$(basename "$f").diff"; then
              echo "::error::app/$f has diverged from ${SIBLING_REPO}"
              cat "/tmp/kw-$(basename "$f").diff"
              status=1
            else
              echo "  ✓ $f"
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Copy the changed file across, run BOTH test suites, and update the recorded"
            echo "hash in both repositories in the same change. A keyword added on one side"
            echo "only means the two apps classify the same alarm differently."
            echo ""
            echo "If this is a station that wants DIFFERENT alarm words, this file is not where"
            echo "you change them — set them in your deployment config and leave the shipped"
            echo "vocabulary alone. If this is a fork that means to differ, point SIBLING_REPO"
            echo "at your own kp-front fork in .github/workflows/ci.yml, or set it to ''."
            exit 1
          fi

  # Third shared thing, and the one whose copies live OUTSIDE backend/app: the
  # roster-snapshot contract (D65). Both products vendor the two JSON Schemas byte
  # for byte so a station can publish ONE file both can read — which only stays true
  # while something compares them. The in-repo test pins their sha256 and cannot see
  # this repository's sibling; edit both sides, update both hashes, and both suites
  # stay green while the contract quietly forks. This job is the only thing that looks.
  #
  # Its own job again, for the same reason the other two are separate: a failure here
  # means "a snapshot valid for one product may be rejected by the other", which is a
  # different question from a leaked field or a misclassified alarm.
  roster-schema-drift:
    name: Roster snapshot contract matches KP Front
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out the sibling repository
        id: sibling
        if: env.SIBLING_REPO != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SIBLING_REPO }}
          path: .kp-front
          fetch-depth: 1

      - name: Diff the roster snapshot schemas
        env:
          SIBLING_STATUS: ${{ steps.sibling.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${SIBLING_REPO:-}" ]; then
            echo "::notice::SIBLING_REPO is empty — cross-repo roster contract check disabled for this fork."
            exit 0
          fi
          if [ "$SIBLING_STATUS" != "success" ]; then
            echo "::notice::Could not check out ${SIBLING_REPO} (private, renamed or unreachable)."
            echo "::notice::Skipping the roster contract drift check. Set SIBLING_REPO in"
            echo "::notice::.github/workflows/ci.yml to a repository this workflow can read, or to ''."
            exit 0
          fi
          # Both schemas, because they are one contract: the snapshot a producer writes
          # and the outcome a consumer reports. Pinning one would leave the other free.
          files="docs/roster-snapshot.schema.json docs/roster-snapshot-outcome.schema.json"
          status=0
          for f in $files; do
            theirs=".kp-front/$f"
            if [ ! -f "$theirs" ]; then
              echo "::error::$f is missing in ${SIBLING_REPO} — the roster contract has changed shape"
              status=1
              continue
            fi
            if ! diff -u "$theirs" "$f" > "/tmp/roster-$(basename "$f").diff"; then
              echo "::error::$f has diverged from ${SIBLING_REPO}"
              cat "/tmp/roster-$(basename "$f").diff"
              status=1
            else
              echo "  ✓ $f"
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Both products publish this schema to self-hosters as ONE contract: a station"
            echo "writes a single snapshot file and points both deployments at it. A field added"
            echo "on one side only means that file is valid for one product and refused by the"
            echo "other — with the station's roster silently half-loaded."
            echo ""
            echo "Regenerate with 'just roster-schema' where the module changed, copy both files"
            echo "across, and update the recorded hashes in both repositories in the same change."
            echo "If this is a fork that means to differ, point SIBLING_REPO at your own kp-front"
            echo "fork in .github/workflows/ci.yml, or set it to ''."
            exit 1
          fi

  # Fourth shared thing, and the one the other three predicted. Both products expose
  # POST /api/alarms and the payload SHAPE was converged deliberately so a station wires its
  # dispatch system once. The LIMITS were never converged and nothing compared them, so the
  # promise was half true: source ≤20 here and ≤16 there, "feld" reserved here and free there,
  # and a whitespace-only title refused here and accepted there — three ways for one relay to
  # get two different answers, none of them visible until the second integration.
  #
  # docs/alarm-intake-conformance.json is the contract as cases rather than prose, byte-
  # identical in both repos: `cases` is the portable subset both must answer the same way,
  # `divergent` records the payloads they legitimately answer differently so the list cannot
  # grow in silence. Each repo's test asserts its own column; only this job compares the file.
  #
  # Its own job again, same reasoning as the other three: a failure here means "a dispatch
  # system valid for one product may be refused by the other", which is a different question
  # from a leaked field, a misclassified alarm or a half-loaded roster.
  alarm-contract-drift:
    name: Alarm intake contract matches KP Front
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out the sibling repository
        id: sibling
        if: env.SIBLING_REPO != ''
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SIBLING_REPO }}
          path: .kp-front
          fetch-depth: 1

      - name: Diff the alarm intake conformance corpus
        env:
          SIBLING_STATUS: ${{ steps.sibling.outcome }}
        run: |
          set -euo pipefail
          if [ -z "${SIBLING_REPO:-}" ]; then
            echo "::notice::SIBLING_REPO is empty — cross-repo alarm contract check disabled for this fork."
            exit 0
          fi
          if [ "$SIBLING_STATUS" != "success" ]; then
            echo "::notice::Could not check out ${SIBLING_REPO} (private, renamed or unreachable)."
            echo "::notice::Skipping the alarm contract drift check. Set SIBLING_REPO in"
            echo "::notice::.github/workflows/ci.yml to a repository this workflow can read, or to ''."
            exit 0
          fi
          f="docs/alarm-intake-conformance.json"
          theirs=".kp-front/$f"
          if [ ! -f "$theirs" ]; then
            echo "::error::$f is missing in ${SIBLING_REPO} — the intake contract has changed shape"
            exit 1
          fi
          if diff -u "$theirs" "$f" > /tmp/alarm-contract.diff; then
            echo "  ✓ $f"
            exit 0
          fi
          echo "::error::$f has diverged from ${SIBLING_REPO}"
          cat /tmp/alarm-contract.diff
          echo ""
          echo "A station running both points ONE dispatch system at both apps. This corpus is"
          echo "the guarantee that the same body gets the same answer from each. Edited on one"
          echo "side only, both suites stay green while the two intakes drift — which is exactly"
          echo "how source ≤20/≤16 and the missing 'feld' slug survived until 2026-08-19."
          echo ""
          echo "Copy the file across, run BOTH suites (each asserts its own column), and land"
          echo "the change in both repositories together. If a payload genuinely converged, it"
          echo "moves from 'divergent' into 'cases' on both sides in the same change."
          echo ""
          echo "If this is a fork that means to differ, point SIBLING_REPO at your own kp-front"
          echo "fork in .github/workflows/ci.yml, or set it to ''."
          exit 1

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Pinned to the project's Python. Bandit installed with uv's default interpreter ran
      # on 3.11, could not parse 3.12 syntax, and SKIPPED app/crud/base.py entirely — a
      # blocking security gate quietly not looking at a file. It reports "Files skipped (0)".
      - name: Install bandit
        run: uv tool install --python ${{ env.PYTHON_VERSION }} bandit

      # Blocking. It was advisory while one finding was outstanding; that finding was reviewed
      # (B104 in config.py — does not apply to a containerised service) and annotated, so the
      # scan is clean and a NEW medium-or-worse finding must now be dealt with rather than
      # scrolled past. Annotate a false positive at the line with `# nosec BXXX` and a reason.
      - name: Security scan with Bandit
        run: uv tool run --python ${{ env.PYTHON_VERSION }} bandit -r app -ll -ii -x app/tests

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U kprueck; do
            echo "Waiting for postgres..."
            sleep 2
          done

      # `-n 3` (pytest-xdist), NOT `-n auto`, and the number is measured, not guessed.
      #
      # This job used to be the whole gate's critical path: 1881 tests on one worker, ~8 min,
      # while every other job bar e2e-smoke finished inside a minute. It also grows with the
      # suite, so it only ever got worse.
      #
      # Measured on a container pinned to 4 vCPU (what a GitHub-hosted ubuntu-latest gives a
      # public repo), same suite, coverage on, one run each:
      #
      #   serial   305s      -n 3    132s   <- knee
      #   -n 2     178s      -n 4    138s
      #                      -n 6    140s
      #                      -n 8    142s
      #
      # Past three workers the curve is flat and then slightly negative: the suite spends its
      # time on Postgres round-trips, not on CPU, so extra workers buy nothing and start
      # costing context switches. `-n auto` is the trap — it reads the CORE COUNT, which is 4
      # here (and 10 on a developer's laptop, and 10 inside a `--cpus=4` container, because a
      # CPU quota does not change nproc). It would pick 4: measurably slower than 3, and on
      # other machines much worse.
      #
      # Three rather than four also leaves a core for the Postgres service container, which on
      # a real runner shares these same 4 vCPUs. The measurement above was, if anything,
      # generous to the higher numbers: Postgres ran outside the CPU budget.
      #
      # Each worker gets its OWN database (`kprueck_test_gw0`, …), created and dropped by
      # backend/tests/conftest.py. Concurrent workers on one database is how a reliable suite
      # becomes a flaky one, and a flaky suite is worse than a slow one. `-n` is deliberately
      # not in addopts: plain `uv run pytest` still runs serially against the single database.
      #
      # `-v` is gone: with three workers interleaving output it printed 1881 lines in a
      # meaningless order. The failure summary is what anyone reads anyway.
      #
      # pytest-cov combines the per-worker coverage data itself, so --cov-fail-under still
      # measures the whole suite.
      - name: Run tests with coverage
        run: uv run pytest -n 3 --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=35
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck_test
          # Explicit rather than relying on the conftest default. Every database the suite
          # touches — the per-worker ones and the migration-drift scratch database — is
          # derived from THIS url, so it is the single knob for pointing the suite elsewhere.
          TEST_DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck_test
          SECRET_KEY: ci-test-secret-key-not-for-production-use-1234567890

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          # `files` (plural). v7 dropped the old singular `file`, which it had been silently
          # ignoring while warning in the log — so the upload was going up with no report
          # attached. Nothing about the job turned red, which is exactly why it survived.
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # Frontend Quality Checks
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint` is `eslint . --max-warnings 17`, and the repo sits at exactly 17. That is a
      # RATCHET, not slack: it is set to today's count on purpose so the number can only go
      # down. All 17 are react-hooks/exhaustive-deps, each behaviour-relevant and each its own
      # small decision (plan 18 §3) — which is why they are capped rather than silenced.
      #
      # So if this step fails with "18 problems", the answer is almost never to raise the cap.
      # Either fix the dependency array you just added, or — if you deliberately removed one —
      # lower the number in frontend/package.json to the new count in the same commit.
      - name: Run ESLint
        run: |
          pnpm lint || {
            echo "::error::ESLint exceeded the warning ratchet (currently 26, all exhaustive-deps)."
            echo "::error::Fix the new warning, or lower the cap in frontend/package.json if you removed one."
            exit 1
          }

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (Vitest)
        run: pnpm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      # GitHub Pages serves site/ verbatim, so the generated pages are committed.
      # This fails if index.html / fr/index.html are behind the template or the
      # texts – otherwise the site in the repo stops being the site on the web.
      # Plain node, no install: build.mjs has no dependencies.
      - name: Landing page is built from its sources
        working-directory: ${{ github.workspace }}
        run: node site/build.mjs --check

  # ============================================
  # E2E — the @smoke subset only.
  #
  # The full suite is ~300 specs at ~25 minutes and flaky enough that a red result had stopped
  # carrying information, so it stayed switched off entirely and CI covered no click-through at
  # all. This runs the eight specs on the paths where a break is both plausible and expensive:
  # log in, land on the board, create an event, select it, create an incident, and alarm intake
  # in and out. Tag more with `{ tag: '@smoke' }` as they prove stable.
  #
  # REQUIRED ON MAIN since 2026-08-21. It was deliberately held out until it had been green
  # across runs it did not deserve to be, and it has: repeated PR and push runs plus the 0.7.0
  # merge, all green, alongside a nightly that has been green for a week. That was the last
  # open item of plan 15 — and the 0.7.0 cycle is the argument for it, since the merge to main
  # was the first time any gate had seen 83 commits and three of these specs were describing
  # flows the app no longer had.
  #
  # A red result here now blocks a merge. If it turns flaky rather than wrong, take the spec
  # out of @smoke — do not take the job out of branch protection.
  #
  # The full suite stays a human step before a release and after touching auth, the board or
  # alarm intake: `cd frontend && pnpm test:e2e` (needs `just dev`). e2e-nightly.yml runs it on
  # a schedule.
  # ============================================
  e2e-smoke:
    name: E2E (@smoke)
    runs-on: ubuntu-latest
    # The whole point is a fast signal; if it is not fast it is not doing its job.
    timeout-minutes: 15
    needs: [backend-test, frontend-build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Python
        working-directory: backend
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # ADMIN_SEED_PASSWORD has to be set and has to match what the specs log in with.
      # Without it the seed mints a RANDOM development password, and every spec fails at the
      # login screen — one of the reasons this job could not simply be switched back on.
      # No ENVIRONMENT=production here on purpose: the specs need the dev fixture board
      # (vehicles, personnel, materials), which a production seed deliberately omits.
      # The seed writes rows; it does not create the schema. This service container is a bare
      # postgres, so without the migrations the very first INSERT dies on `relation "users"
      # does not exist`. The other jobs never needed this — pytest builds its own schema and
      # the images job migrates inside the container — which is why the gap only shows here.
      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck

      - name: Seed database
        working-directory: backend
        run: uv run python -m app.seed
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          ADMIN_SEED_PASSWORD: ${{ env.E2E_PASSWORD }}
          VIEWER_PASSWORD: ${{ env.E2E_PASSWORD }}

      - name: Start backend server
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          CORS_ORIGINS: http://localhost:3000

      - name: Run E2E tests (@smoke)
        working-directory: frontend
        run: pnpm exec playwright test --grep @smoke
        env:
          TEST_USERNAME: admin
          TEST_PASSWORD: ${{ env.E2E_PASSWORD }}
          # No @smoke spec logs in as the viewer today, so this is prophylactic: tagging one
          # later must not silently reproduce the nightly's failure, where the missing variable
          # sends the specs to the dev default in tests/constants.ts and every viewer login
          # times out at the login screen.
          VIEWER_PASSWORD: ${{ env.E2E_PASSWORD }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # Images: build all four, boot the production stack, smoke it
  # ============================================
  # This is the job that makes a published release trustworthy: it builds the SAME images
  # release.yml pushes, boots them through docker-compose.yml exactly as a self-hoster would,
  # and proves the one thing that can't be unit-tested — that the four containers can talk to
  # each other behind Caddy on a single origin.
  images:
    name: Images (build + boot + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write .env (compose reads it before anything else)
        run: |
          {
            echo "POSTGRES_PASSWORD=ci_test_password"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "AUTH_SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_SEED_PASSWORD=$(openssl rand -hex 16)"
            echo "VIEWER_PASSWORD=$(openssl rand -hex 16)"
            echo "HTTP_PORT=8080"
            echo "PUBLIC_URL=http://localhost:8080"
            # compose pulls ghcr.io/…:${KP_RUECK_TAG:-latest}; point it at the images built
            # below so the stack boots THIS commit instead of the last published release.
            echo "KP_RUECK_TAG=ci"
          } > .env

      - name: Validate compose config
        run: docker compose config -q

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Built WITHOUT NEXT_PUBLIC_API_URL on purpose: the published image must not carry any
      # one station's API URL. The browser calls /backend-api on its own origin instead.
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runner
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build tileserver image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tileserver/Dockerfile
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-tileserver:ci
          cache-from: type=gha,scope=tileserver
          cache-to: type=gha,mode=max,scope=tileserver

      # Not booted (it needs a printer on the LAN), but built so a broken Dockerfile can't
      # reach a release.
      - name: Build print-agent image
        uses: docker/build-push-action@v7
        with:
          context: ./tools/print-agent
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-print-agent:ci
          cache-from: type=gha,scope=print-agent
          cache-to: type=gha,mode=max,scope=print-agent

      - name: Boot the stack
        run: docker compose up -d --wait   # waits for db/backend/frontend/tileserver health

      - name: Smoke test (everything through the single origin)
        run: |
          set -euo pipefail
          # Backend, routed by Caddy.
          curl -fsS http://localhost:8080/health
          # Backend through the Next.js proxy — the path a browser takes when the image
          # carries no baked-in API URL. This is the whole generic-image premise.
          curl -fsSL http://localhost:8080/backend-api/health
          # The app itself renders. Written to a file first: `curl | grep -q` exits on the
          # first match, curl dies of SIGPIPE, and pipefail turns a PASS into a failure.
          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -qi "<html" /tmp/index.html || { echo "frontend did not render"; exit 1; }
          # Offline tiles reachable on the same origin.
          curl -fsS http://localhost:8080/tiles/health
          # Log in as the seeded admin and reuse the cookie: proves auth, the DB, first-boot
          # seeding and the cookie flags all work through the single origin — the path every
          # operator takes, and the one a broken deployment fails at.
          admin_pw=$(grep '^ADMIN_SEED_PASSWORD=' .env | cut -d= -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/cookies.txt \
            -X POST http://localhost:8080/api/auth/login \
            -d "username=admin&password=${admin_pw}")
          test "$code" = "200" || { echo "login failed: HTTP $code"; exit 1; }
          curl -fsS -b /tmp/cookies.txt http://localhost:8080/api/auth/me > /dev/null
          echo "stack smoke OK"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
