name: CI

# CI strategy – keep this comment truthful, it is the only place the split is written down.
#
# BLOCKING (a red one of these must stop a merge; these are the checks required on main):
#   secrets, backend-lint, backend-test, backend-security, print-agent, frontend-lint,
#   frontend-typecheck, frontend-unit-tests, frontend-build, images
#   plus backend-typecheck's FIRST step (mypy over the packages that are at zero)
#   plus telemetry-drift — the ONLY check that compares the vendored sanitiser against
#   kp-front; the in-repo hash test cannot see the other repository. Add it to the required
#   list on main once it has run a few times (it depends on a sibling repo being reachable).
#
# ADVISORY (runs, reports, never fails the build) – with the real numbers as of 2026-07-30:
#   backend-typecheck  mypy, second step – 241 errors in 28 files across the packages NOT in
#                      the blocking subset (was 711 in 79 before app/crud, app/background,
#                      websocket_manager.py, models.py, traccar.py and now app/api were
#                      cleared and moved into the blocking step). What is left is app/services,
#                      app/main and the seed scripts. Still a project, not a cleanup:
#                      progress = moving one more package into the blocking step, at zero.
#   codecov upload   – never worth failing a build over.
#
# bandit used to be here too, at "52 findings". That number was misleading: with the `-ll -ii`
# threshold the run reported exactly ONE medium finding (B104, which does not apply to a
# containerised service). It was reviewed, annotated at the line, and the gate is now blocking.
# The rest sit below the threshold and were never reported.
#
# The rule behind the split: a check that is always red teaches people to ignore red. Either a
# gate is at zero and blocks, or it is honestly labelled a report.
#
# NOT A MERGE GATE, but not optional either:
#   CodeQL – cross-file taint tracking, reporting into the Security tab per PR and weekly.
#            It runs from GitHub's DEFAULT setup (repo settings → Code security), not from a
#            workflow file in this repo, and it covers five languages there: actions,
#            javascript, javascript-typescript, python, typescript.
#            Do NOT add a `codeql.yml`: with default setup enabled, GitHub rejects the SARIF
#            an advanced workflow uploads, so the job fails while the real analysis passes
#            beside it. (kp-front is the other way round — default setup is off there, so it
#            needs its workflow file. Same coverage, different mechanism.)
#
# RUNS, BUT NOT YET A REQUIRED CHECK:
#   e2e-smoke – eight @smoke-tagged Playwright specs on the core path. It used to be `if: false`
#         and covered nothing. It is deliberately NOT in the required-checks list on main until
#         it has proved stable across a handful of real runs; see the comment on the job. The
#         full ~300-spec suite is a human step (`cd frontend && pnpm test:e2e`) plus the nightly
#         schedule in e2e-nightly.yml.
#
# Coverage: min 35% (target: 50% → 70%).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml runs this whole gate against the tag before publishing images.
  workflow_call:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"   # Active LTS; 20 went EOL 2026-04-30. Match frontend/Dockerfile.
  PNPM_VERSION: "9"
  # Seeds the throwaway E2E database and is what the specs log in with. Not a secret — the
  # database and the container both die with the job — but it must be >= 12 chars, and the
  # seed step and the specs must read the SAME value or every spec fails at the login screen.
  E2E_PASSWORD: "e2e-ci-password-not-a-secret"  # gitleaks:allow

jobs:
  # ============================================
  # Secrets
  # ============================================
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CLI via container (not gitleaks-action, which needs a license key for org repos).
      # Scans exactly the TRACKED tree at HEAD (git archive), so a contributor's local .env
      # and node_modules never enter the picture. Deliberate test values carry inline
      # `gitleaks:allow` comments — the CI .env in the images job is generated at runtime
      # with openssl, so there is nothing to allow there.
      - name: Scan tracked tree for secrets
        run: |
          mkdir -p /tmp/scan
          git archive HEAD | tar -x -C /tmp/scan
          docker run --rm -v /tmp/scan:/repo zricethezav/gitleaks:latest \
            detect --source /repo --no-git --redact --exit-code 1

  # ============================================
  # Backend Quality Checks
  # ============================================
  backend-lint:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      # Blocking for the modules that are clean, advisory for the rest. Splitting it this way
      # is the point: one gate over the whole tree could only ever be advisory (241 findings
      # left), and an advisory gate is one nobody reads.
      # These paths are at zero and must stay there.
      - name: Type check with mypy (blocking subset)
        run: >-
          uv run mypy
          app/auth app/middleware app/schemas app/services/alerting
          app/crud app/background app/api
          app/websocket_manager.py app/models.py app/traccar.py
          --ignore-missing-imports

      # The rest, as a report. Moving a package out of here and into the step above is the
      # unit of progress — don't widen the blocking list without getting it to zero first.
      - name: Type check with mypy (rest, advisory)
        run: uv run mypy app --ignore-missing-imports
        continue-on-error: true

  # The print agent is not part of the backend: it runs on a box in the station, speaks to
  # BOTH KP Front and KP Rück, and its core is deliberately dependency-free. So it gets its
  # own job with a plain Python — which is also what proves the bare-Pi install path, since
  # the run would fail here if anything in the core started needing a package.
  print-agent:
    name: Print Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/print-agent

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tests (stub backends + fake lp/lpstat, no printer needed)
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q

  # The vendored telemetry modules are shared with kp-front by COPY, not by package. The
  # in-repo test hashes them against a recorded literal, which catches an accidental edit here
  # — but not the case the docstring actually warns about: change scrub.py in one repo, update
  # that repo's own literal, and BOTH suites stay green while the two sanitisers diverge. One
  # of them then strips something the other leaks.
  #
  # So this job is the only thing that ever compares the two repositories. kp-front is public,
  # so no token is needed. It runs on the default branch of the sibling, which is what a
  # station actually deploys — pinning a ref would compare against something nobody runs.
  telemetry-drift:
    name: Telemetry sanitiser matches KP Front
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out kp-front
        uses: actions/checkout@v7
        with:
          repository: feuerwehr-oberwil/kp-front
          path: .kp-front
          fetch-depth: 1

      - name: Diff the vendored telemetry modules
        run: |
          set -euo pipefail
          # consent.py and dsn.py are deliberately NOT here: the first talks to whatever table
          # each app keeps deployment state in, the second holds the app's own ingest project.
          files="scrub.py envelope.py outbox.py forwarder.py __init__.py"
          status=0
          for f in $files; do
            ours="backend/app/telemetry/$f"
            theirs=".kp-front/backend/app/telemetry/$f"
            if [ ! -f "$theirs" ]; then
              echo "::error::$f is missing in kp-front — the vendored set has changed shape"
              status=1
              continue
            fi
            if ! diff -u "$theirs" "$ours" > "/tmp/$f.diff"; then
              echo "::error::app/telemetry/$f has diverged from kp-front"
              cat "/tmp/$f.diff"
              status=1
            else
              echo "  ✓ $f"
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "Copy the changed file across, run BOTH test suites, and update the recorded"
            echo "hash in both repositories in the same change. Updating one side alone is"
            echo "exactly the failure this job exists to catch."
            exit 1
          fi

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # Pinned to the project's Python. Bandit installed with uv's default interpreter ran
      # on 3.11, could not parse 3.12 syntax, and SKIPPED app/crud/base.py entirely — a
      # blocking security gate quietly not looking at a file. It reports "Files skipped (0)".
      - name: Install bandit
        run: uv tool install --python ${{ env.PYTHON_VERSION }} bandit

      # Blocking. It was advisory while one finding was outstanding; that finding was reviewed
      # (B104 in config.py — does not apply to a containerised service) and annotated, so the
      # scan is clean and a NEW medium-or-worse finding must now be dealt with rather than
      # scrolled past. Annotate a false positive at the line with `# nosec BXXX` and a reason.
      - name: Security scan with Bandit
        run: uv tool run --python ${{ env.PYTHON_VERSION }} bandit -r app -ll -ii -x app/tests

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5433 -U kprueck; do
            echo "Waiting for postgres..."
            sleep 2
          done

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=35 -v
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck_test
          SECRET_KEY: ci-test-secret-key-not-for-production-use-1234567890

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # Frontend Quality Checks
  # ============================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  frontend-typecheck:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (Vitest)
        run: pnpm test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ============================================
  # E2E — the @smoke subset only.
  #
  # The full suite is ~300 specs at ~25 minutes and flaky enough that a red result had stopped
  # carrying information, so it stayed switched off entirely and CI covered no click-through at
  # all. This runs the eight specs on the paths where a break is both plausible and expensive:
  # log in, land on the board, create an event, select it, create an incident, and alarm intake
  # in and out. Tag more with `{ tag: '@smoke' }` as they prove stable.
  #
  # NOT YET IN THE REQUIRED-CHECKS LIST on main, on purpose. Phase 1 of the plan — run it
  # repeatedly against an unchanged tree and see which specs flake — has not been done, and
  # promoting an unmeasured suite to a merge gate is how you get a red job people learn to click
  # through. Let it run on a few PRs first; when it has been green across runs it did not
  # deserve to be, add "E2E (@smoke)" to branch protection. Until then a red result here is
  # information, not a blocker.
  #
  # The full suite stays a human step before a release and after touching auth, the board or
  # alarm intake: `cd frontend && pnpm test:e2e` (needs `just dev`). e2e-nightly.yml runs it on
  # a schedule.
  # ============================================
  e2e-smoke:
    name: E2E (@smoke)
    runs-on: ubuntu-latest
    # The whole point is a fast signal; if it is not fast it is not doing its job.
    timeout-minutes: 15
    needs: [backend-test, frontend-build]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Python
        working-directory: backend
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # ADMIN_SEED_PASSWORD has to be set and has to match what the specs log in with.
      # Without it the seed mints a RANDOM development password, and every spec fails at the
      # login screen — one of the reasons this job could not simply be switched back on.
      # No ENVIRONMENT=production here on purpose: the specs need the dev fixture board
      # (vehicles, personnel, materials), which a production seed deliberately omits.
      # The seed writes rows; it does not create the schema. This service container is a bare
      # postgres, so without the migrations the very first INSERT dies on `relation "users"
      # does not exist`. The other jobs never needed this — pytest builds its own schema and
      # the images job migrates inside the container — which is why the gap only shows here.
      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck

      - name: Seed database
        working-directory: backend
        run: uv run python -m app.seed
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          ADMIN_SEED_PASSWORD: ${{ env.E2E_PASSWORD }}
          VIEWER_PASSWORD: ${{ env.E2E_PASSWORD }}

      - name: Start backend server
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          CORS_ORIGINS: http://localhost:3000

      - name: Run E2E tests (@smoke)
        working-directory: frontend
        run: pnpm exec playwright test --grep @smoke
        env:
          TEST_USERNAME: admin
          TEST_PASSWORD: ${{ env.E2E_PASSWORD }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ============================================
  # Images: build all four, boot the production stack, smoke it
  # ============================================
  # This is the job that makes a published release trustworthy: it builds the SAME images
  # release.yml pushes, boots them through docker-compose.yml exactly as a self-hoster would,
  # and proves the one thing that can't be unit-tested — that the four containers can talk to
  # each other behind Caddy on a single origin.
  images:
    name: Images (build + boot + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write .env (compose reads it before anything else)
        run: |
          {
            echo "POSTGRES_PASSWORD=ci_test_password"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "AUTH_SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_SEED_PASSWORD=$(openssl rand -hex 16)"
            echo "VIEWER_PASSWORD=$(openssl rand -hex 16)"
            echo "HTTP_PORT=8080"
            echo "PUBLIC_URL=http://localhost:8080"
            # compose pulls ghcr.io/…:${KP_RUECK_TAG:-latest}; point it at the images built
            # below so the stack boots THIS commit instead of the last published release.
            echo "KP_RUECK_TAG=ci"
          } > .env

      - name: Validate compose config
        run: docker compose config -q

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Built WITHOUT NEXT_PUBLIC_API_URL on purpose: the published image must not carry any
      # one station's API URL. The browser calls /backend-api on its own origin instead.
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: runner
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build tileserver image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./tileserver/Dockerfile
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-rueck-tileserver:ci
          cache-from: type=gha,scope=tileserver
          cache-to: type=gha,mode=max,scope=tileserver

      # Not booted (it needs a printer on the LAN), but built so a broken Dockerfile can't
      # reach a release.
      - name: Build print-agent image
        uses: docker/build-push-action@v7
        with:
          context: ./tools/print-agent
          load: true
          tags: ghcr.io/feuerwehr-oberwil/kp-print-agent:ci
          cache-from: type=gha,scope=print-agent
          cache-to: type=gha,mode=max,scope=print-agent

      - name: Boot the stack
        run: docker compose up -d --wait   # waits for db/backend/frontend/tileserver health

      - name: Smoke test (everything through the single origin)
        run: |
          set -euo pipefail
          # Backend, routed by Caddy.
          curl -fsS http://localhost:8080/health
          # Backend through the Next.js proxy — the path a browser takes when the image
          # carries no baked-in API URL. This is the whole generic-image premise.
          curl -fsSL http://localhost:8080/backend-api/health
          # The app itself renders. Written to a file first: `curl | grep -q` exits on the
          # first match, curl dies of SIGPIPE, and pipefail turns a PASS into a failure.
          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -qi "<html" /tmp/index.html || { echo "frontend did not render"; exit 1; }
          # Offline tiles reachable on the same origin.
          curl -fsS http://localhost:8080/tiles/health
          # Log in as the seeded admin and reuse the cookie: proves auth, the DB, first-boot
          # seeding and the cookie flags all work through the single origin — the path every
          # operator takes, and the one a broken deployment fails at.
          admin_pw=$(grep '^ADMIN_SEED_PASSWORD=' .env | cut -d= -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' -c /tmp/cookies.txt \
            -X POST http://localhost:8080/api/auth/login \
            -d "username=admin&password=${admin_pw}")
          test "$code" = "200" || { echo "login failed: HTTP $code"; exit 1; }
          curl -fsS -b /tmp/cookies.txt http://localhost:8080/api/auth/me > /dev/null
          echo "stack smoke OK"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
