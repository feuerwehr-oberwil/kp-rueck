name: CodeQL

# Static security analysis for the TS frontend and Python backend. Code scanning is only
# available on public repos (or with GitHub Advanced Security), so the jobs are gated on
# repository visibility — the workflow is a no-op on a private fork and works as-is here.
#
# This complements, and does not replace, the per-language gates in ci.yml: bandit is
# blocking there for Python, and CodeQL adds cross-file taint tracking that a per-file
# linter cannot do. Findings land in the Security tab, not as a red merge gate — treat a
# new alert as work, not as something to click past.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1" # weekly Monday sweep for newly published query packs

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
