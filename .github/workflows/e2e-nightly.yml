name: E2E (full suite, nightly)

# The whole ~300-spec Playwright suite, on a schedule rather than per pull request.
#
# ci.yml runs only the eight @smoke specs, because the full suite takes ~25 minutes and is
# flaky enough that gating merges on it taught people to click through red. That trade leaves a
# gap: everything outside @smoke is only covered when somebody remembers to run it locally.
# This closes the gap without putting the flake back in front of a merge.
#
# It is worth exactly as much as the attention it gets. A nightly nobody reads is the same
# failure in a new costume — so a failure opens an issue rather than only turning a square red
# on a page nobody visits. If you find yourself ignoring those issues, the honest move is to
# delete this workflow, not to keep it as decoration.
#
# The path to fewer of them: fix or quarantine a flaky spec the same day, and move specs into
# @smoke as they earn it.

on:
  schedule:
    - cron: "42 2 * * *" # 02:42 UTC, nightly
  workflow_dispatch: # so you can ask for a run before a release
    inputs:
      grep:
        description: "Only run specs matching this (Playwright --grep). Empty = the full suite."
        required: false
        default: ""


permissions:
  contents: read
  issues: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"   # Active LTS; 20 went EOL 2026-04-30. Match frontend/Dockerfile.
  PNPM_VERSION: "9"
  # Same throwaway fixture password as ci.yml — seeds a database that dies with the job.
  E2E_PASSWORD: "e2e-ci-password-not-a-secret" # gitleaks:allow
  # 22-print-outcome plays the print agent against the real agent API. Those endpoints fail
  # CLOSED (`api/print.py`: no PRINT_AGENT_TOKEN configured means off, not open), so the
  # backend and the specs must be handed the same throwaway value or every claim gets a 403.
  E2E_PRINT_AGENT_TOKEN: "e2e-print-agent-token-not-a-secret" # gitleaks:allow

jobs:
  full-suite:
    name: E2E (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kprueck
          POSTGRES_PASSWORD: kprueck
          POSTGRES_DB: kprueck
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Python
        working-directory: backend
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # Dev seed on purpose: the specs need the fixture board (vehicles, personnel,
      # materials) that a production seed deliberately omits.
      # The seed writes rows; it does not create the schema. This service container is a bare
      # postgres, so without the migrations the first INSERT dies on `relation "users" does not
      # exist` — which is exactly what this job did on every run since it was written. Same
      # omission as the e2e-smoke job in ci.yml; fixed there first, then found here.
      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck

      - name: Seed database
        working-directory: backend
        run: uv run python -m app.seed
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          ADMIN_SEED_PASSWORD: ${{ env.E2E_PASSWORD }}
          VIEWER_PASSWORD: ${{ env.E2E_PASSWORD }}

      - name: Start backend server
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@localhost:5433/kprueck
          CORS_ORIGINS: http://localhost:3000
          PRINT_AGENT_TOKEN: ${{ env.E2E_PRINT_AGENT_TOKEN }}

      # The filter goes through the environment, never interpolated into the shell line: a
      # `${{ inputs.* }}` expanded inside `run:` is a script-injection hole, and this input is
      # attacker-controllable by anyone who can dispatch the workflow.
      - name: Run the E2E suite
        working-directory: frontend
        # Ten minutes under the job's 60, and that gap is the point. A job that blows its own
        # `timeout-minutes` is *cancelled*, and whether a later `if: cancelled()` step still
        # runs is not something to bet a signal on — from 2026-07-27 to 07-30 it did not, and
        # four red nights went unreported. Timing out here instead fails one step and leaves
        # the job alive, so the issue below is filed the ordinary way.
        timeout-minutes: 50
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          TEST_USERNAME: admin
          TEST_PASSWORD: ${{ env.E2E_PASSWORD }}
          # The seed step above gave the read-only `viewer` account this same password, so the
          # specs have to be told it too. Omitting it does not fail loudly: `tests/constants.ts`
          # falls back to the dev default `viewer`, the login is simply refused, and all fifteen
          # viewer-role specs die on `waitForURL` ten seconds later — which is what had been
          # reported as a broken `09-resource-badges` since 2026-07-26.
          VIEWER_PASSWORD: ${{ env.E2E_PASSWORD }}
          PRINT_AGENT_TOKEN: ${{ env.E2E_PRINT_AGENT_TOKEN }}
          CI: true
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            echo "Filtered run: --grep $GREP"
            pnpm exec playwright test --grep "$GREP"
          else
            pnpm test:e2e
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-nightly
          path: frontend/playwright-report/
          retention-days: 14

      # A red square on a page nobody opens is not a signal. One open issue, updated rather
      # than duplicated, is.
      #
      # `cancelled()` is not belt-and-braces: blowing `timeout-minutes` ends the job as
      # *cancelled*, not failed, so `failure()` alone skips this step — which is exactly what
      # happened on every scheduled run from 2026-07-27 to 2026-07-30. The suite ran an hour,
      # got killed, and said nothing. A run somebody cancels by hand will now also file a
      # comment; that is the cheaper mistake of the two.
      - name: Open or update an issue on failure
        if: failure() || cancelled()
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Nightly E2E suite is failing'
            // A cancelled job here is almost always the 60-minute cap, and saying "failed"
            // sends the reader hunting for a failing assertion that does not exist.
            const outcome =
              '${{ job.status }}' === 'cancelled'
                ? 'was cancelled (most likely the 60-minute cap) on'
                : 'failed on'
            const body = [
              `The nightly full Playwright suite ${outcome} \`${context.sha.slice(0, 8)}\`.`,
              '',
              `[Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) —`,
              'the `playwright-report-nightly` artifact has the traces and screenshots.',
              '',
              'This does not block merges: only the eight `@smoke` specs run per pull request.',
              'Fix the spec or quarantine it — a flaky nightly left red is how the whole suite',
              'ended up switched off the first time.',
            ].join('\n')

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-e2e',
            })

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['nightly-e2e'],
              })
            }
