# Development docker-compose with hot reload
services:
  postgres:
    image: postgres:16-alpine
    container_name: kprueck-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: kprueck
      POSTGRES_PASSWORD: kprueck
      POSTGRES_DB: kprueck
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kprueck"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kprueck-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kprueck-backend-dev
    restart: unless-stopped
    command: ./start-dev.sh
    volumes:
      - ./backend:/app
      # Keep .venv OUT of the bind mount. Host and container need different
      # interpreter paths, so sharing one venv means whoever ran last wins:
      # a host `uv run` (ruff, pytest, `just db migrate`) recreated ~80
      # packages under the container's feet, and a container-side `uv run`
      # left the host with Linux binaries. Either way the mass file change
      # floods watchfiles and uvicorn's reloader kills its worker without
      # respawning – backend goes to `health 000` until a manual restart.
      # An anonymous volume gives the container its own venv and ends it.
      - /app/.venv
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@postgres:5432/kprueck
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      # Overridable, and that matters: with the bypass on, EVERY session is an admin, so
      # every role-dependent assertion silently passes for the wrong reason. CI runs without
      # it. Set AUTH_BYPASS_AUTH_DEV=false before `just dev` when testing viewer/editor
      # behaviour locally, or the result means nothing.
      AUTH_BYPASS_AUTH_DEV: "${AUTH_BYPASS_AUTH_DEV:-true}"
      # Without this the seed mints a RANDOM admin password and prints it once. The E2E
      # fixtures then log in with their default, every spec times out at the login screen,
      # and the per-username throttle locks the account for 300s – a full run reports ~200
      # failures that mean nothing. Must be >= 12 characters (`get_admin_password()` in
      # backend/app/seed.py rejects shorter). Keep in step with frontend/tests/constants.ts.
      ADMIN_SEED_PASSWORD: "${ADMIN_SEED_PASSWORD:-kp-dev-password}"
      RELOAD: "true"
      # Divera stays OFF unless this is set — an unset key means `get_provider()`
      # returns None and every outbound path (alarm, Mitteilung) is refused before
      # it can reach anybody's phone. Set it in the repo-root `.env` (gitignored)
      # when you actually want to test against Divera, and remember the key is the
      # REAL brigade key: a send from a dev board is a real push to real people.
      DIVERA_ACCESS_KEY: "${DIVERA_ACCESS_KEY:-}"
      # Dev-only default so the print agent can talk to this backend out of the box; in
      # production the same variable is empty and the endpoints stay fail-closed.
      PRINT_AGENT_TOKEN: ${PRINT_AGENT_TOKEN:-dev-print-token}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The backend image ships no curl; probe with the interpreter instead.
      # 127.0.0.1, not localhost: inside this container `localhost` resolves to ::1 first and
      # uvicorn binds IPv4 only, so the probe was refused on every run – the dev backend sat
      # `unhealthy` forever while answering the host perfectly well. Same trap, and the same
      # fix, as the frontend probe in docker-compose.yml.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kprueck-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kprueck-frontend-dev
    restart: unless-stopped
    command: pnpm dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-side API URL (for Next.js server)
      INTERNAL_API_URL: http://backend:8000
      CARTO_API_KEY: ${CARTO_API_KEY:-}
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: Next binds IPv4 only (HOSTNAME=0.0.0.0) while `localhost`
      # resolves to ::1 first inside the image, so the probe would always be refused.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          # 4G, not 1G. Next's dev server compiles ~3000 modules and sat at
          # 99.9% of a 1G cap from the moment it started. It never got OOM-killed
          # either – node just GC-thrashed at 100% CPU and stopped answering, so
          # the page would not reload while the container still looked "up".
          memory: 4G
    networks:
      - kprueck-network

  tileserver:
    build:
      context: .
      dockerfile: ./tileserver/Dockerfile
    container_name: kprueck-tileserver-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - tileserver-dev-data:/data
    environment:
      - TILESERVER_PORT=8080
      # Same reason as the production stack: without this the container always looks for
      # basel-landschaft.mbtiles regardless of TILES_NAME. See docker-compose.yml.
      - TILES_NAME=${TILES_NAME:-basel-landschaft}
    networks:
      - kprueck-network
    # Automatically creates minimal tiles on first run
    # For full-resolution tiles: just tiles-download
    healthcheck:
      # The tileserver image ships neither wget nor curl; probe via node.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  # Thermal printer agent (optional - for local command post installations)
  # Start with: docker compose -f docker-compose.dev.yml --profile printing up -d
  # Or: just printer
  print-agent:
    build:
      context: ./tools/print-agent
      dockerfile: Dockerfile
    container_name: kprueck-print-agent-dev
    restart: unless-stopped
    # Use host network to access printer on local LAN
    network_mode: "host"
    environment:
      # Backend URL (use localhost since we're on host network)
      BACKEND_URL: http://localhost:8000
      # The print endpoints are fail-closed: with no token on BOTH ends they answer 403 and
      # the agent stops on its first cycle. Same default as the backend service above, so
      # `--profile printing` works without an .env; override both with one PRINT_AGENT_TOKEN.
      AGENT_TOKEN: ${PRINT_AGENT_TOKEN:-dev-print-token}
      # Printer config (address, on/off) is fetched from backend settings, not set here.
      # Fallback pace behind the long poll. These are the names the agent actually reads –
      # the previous POLL_INTERVAL was never read by any version of the agent.
      POLL_INTERVAL_IDLE: ${POLL_INTERVAL_IDLE:-10}
      POLL_INTERVAL_ACTIVE: ${POLL_INTERVAL_ACTIVE:-5}
      DRY_RUN: ${DRY_RUN:-false}
      LOG_LEVEL: INFO
    profiles:
      - printing
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  kprueck-network:
    driver: bridge

volumes:
  postgres_dev_data:
  tileserver-dev-data:
