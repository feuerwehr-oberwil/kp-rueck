# Development docker-compose with hot reload
services:
  postgres:
    image: postgres:16-alpine
    container_name: kprueck-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: kprueck
      POSTGRES_PASSWORD: kprueck
      POSTGRES_DB: kprueck
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kprueck"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kprueck-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kprueck-backend-dev
    restart: unless-stopped
    command: ./start-dev.sh
    volumes:
      - ./backend:/app
      # Keep .venv OUT of the bind mount. Host and container need different
      # interpreter paths, so sharing one venv means whoever ran last wins:
      # a host `uv run` (ruff, pytest, `just db migrate`) recreated ~80
      # packages under the container's feet, and a container-side `uv run`
      # left the host with Linux binaries. Either way the mass file change
      # floods watchfiles and uvicorn's reloader kills its worker without
      # respawning — backend goes to `health 000` until a manual restart.
      # An anonymous volume gives the container its own venv and ends it.
      - /app/.venv
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://kprueck:kprueck@postgres:5432/kprueck
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      AUTH_BYPASS_AUTH_DEV: "true"
      RELOAD: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The backend image ships no curl; probe with the interpreter instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - kprueck-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: kprueck-frontend-dev
    restart: unless-stopped
    command: pnpm dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-side API URL (for Next.js server)
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, not localhost: Next binds IPv4 only (HOSTNAME=0.0.0.0) while `localhost`
      # resolves to ::1 first inside the image, so the probe would always be refused.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - kprueck-network

  tileserver:
    build:
      context: .
      dockerfile: ./tileserver/Dockerfile
    container_name: kprueck-tileserver-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - tileserver-dev-data:/data
    environment:
      - TILESERVER_PORT=8080
    networks:
      - kprueck-network
    # Automatically creates minimal tiles on first run
    # For full-resolution tiles: make tiles-download
    healthcheck:
      # The tileserver image ships neither wget nor curl; probe via node.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

  # Thermal printer agent (optional - for local command post installations)
  # Start with: docker compose -f docker-compose.dev.yml --profile printing up -d
  # Or: just print-agent
  print-agent:
    build:
      context: ./print-agent
      dockerfile: Dockerfile
    container_name: kprueck-print-agent-dev
    restart: unless-stopped
    # Use host network to access printer on local LAN
    network_mode: "host"
    environment:
      # Backend URL (use localhost since we're on host network)
      BACKEND_URL: http://localhost:8000
      # Printer config is fetched from backend settings
      POLL_INTERVAL: ${POLL_INTERVAL:-2}
      DRY_RUN: ${DRY_RUN:-false}
      LOG_LEVEL: INFO
    profiles:
      - printing
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  kprueck-network:
    driver: bridge

volumes:
  postgres_dev_data:
  tileserver-dev-data:
