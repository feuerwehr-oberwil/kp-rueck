[project]
name = "kprueck-backend"
version = "0.1.0"
description = "FastAPI backend for KP Rück firefighting operations dashboard"
license = "AGPL-3.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "alembic>=1.13.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "pyjwt>=2.8.0",
    "pillow>=11.0.0",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "reportlab>=4.4.4",
    "apscheduler>=3.10.4",
    "markdown>=3.9",
    "python-socketio>=5.14.3",
    "fastapi-socketio>=0.0.10",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "bandit>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP042: the schema enums are `class X(str, Enum)`. StrEnum would be the modern form, but it
# changes what `str(X.member)` returns ("value" instead of "X.member"), and those enums are
# serialised into API responses. Deliberate deferral, not an oversight.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests bind throwaway values, patch in mock classes named like classes, and annotate fixtures
# with string forward-refs whose real import happens inside the function body. All deliberate
# in test code; none of it would pass in `app/`.
"tests/**" = ["F821", "N806", "F841", "E731", "F811"]
# E402: Module import not at top - intentional for logging setup before imports
"app/main.py" = ["E402"]
# E402: Secondary routers defined after primary router in same file
"app/api/assignments.py" = ["E402"]
"app/api/reko.py" = ["E402"]
# N815: Traccar model uses camelCase to match external Traccar API response format
"app/traccar.py" = ["N815"]
# N806: BATCH_SIZE is a constant, uppercase is intentional
"app/services/sync_service.py" = ["N806"]
"app/seed.py" = ["N806"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = [
    "--strict-markers",
]
# Coverage: run explicitly with  pytest --cov=app --cov-report=term-missing --cov-fail-under=35
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Unit tests (isolated, no external dependencies)",
    "integration: Integration tests (may use database)",
    "security: Security-focused tests",
    "slow: Tests that take longer to run",
    "api: API endpoint tests",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.28.1",
    "bandit>=1.7.0",
    "pypdf>=6.14.2",
]
