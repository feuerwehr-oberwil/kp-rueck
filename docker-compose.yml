# Self-hosting KP Rück on a VPS: Postgres + backend + frontend + tileserver behind one origin.
# This is the PRODUCTION stack (published images, no source needed). For hot-reload development
# use docker-compose.dev.yml — `just dev`.
#
#   cp .env.example .env    # fill in the required secrets
#   docker compose up -d    # pulls the published images, migrates + seeds on boot
#
# Updating:  docker compose pull && docker compose up -d
# Pinning:   set KP_RUECK_TAG=0.1.0 in .env (default: latest). Rollback = pin the older tag.
#
# Everything is served through Caddy on ONE origin, which is what makes the published frontend
# image generic: the browser talks only to its own host, and Caddy fans out to the backend
# (/socket.io for the live board, /api for the direct API) and the tileserver (/tiles).
# Set DOMAIN in .env for automatic HTTPS, or leave it empty to serve plain HTTP on HTTP_PORT
# for a trusted LAN.
#
# To build from source instead (contributors, or a patched fork), see the note on each service.

name: kp-rueck

# Cap container logs so a long-lived station VPS can't slowly fill its disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # Memory ceiling. Not a reservation — it decides WHO gets killed when the box runs out,
    # rather than leaving that to the kernel's choice of victim. Numbers are ~2x the peak
    # measured on the production deployment (`railway metrics`, 2026-07-29), not guesses;
    # re-measure before tightening them.
    # Postgres: 221 MB peak measured. The most important one NOT to kill —
    # a killed database takes the incident record with it, so it gets the most headroom.
    mem_limit: 1g
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kprueck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kprueck}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kprueck} -d ${POSTGRES_DB:-kprueck}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [kprueck]
    # No published ports: reachable only inside the compose network.

  backend:
    image: ghcr.io/feuerwehr-oberwil/kp-rueck-backend:${KP_RUECK_TAG:-latest}
    # Build from source instead: comment out `image:` and uncomment
    # build: { context: ./backend, dockerfile: Dockerfile }
    restart: unless-stopped
    # Memory ceiling. Not a reservation — it decides WHO gets killed when the box runs out,
    # rather than leaving that to the kernel's choice of victim. Numbers are ~2x the peak
    # measured on the production deployment (`railway metrics`, 2026-07-29), not guesses;
    # re-measure before tightening them.
    # 498 MB peak measured, but PDF export and Excel import spike well above
    # steady state, and this is the process that must not die mid-Einsatz.
    mem_limit: 1g
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Declares this a real deployment: mandatory secrets (no per-restart SECRET_KEY),
      # no auth bypass, no sample incidents seeded onto the board. See app/environment.py.
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kprueck}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-kprueck}
      # Signs sessions/tokens — mandatory in production, and must stay STABLE.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      # Signs JWTs — keep it STABLE (changing it logs everyone out).
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env (openssl rand -hex 32)}
      # Same origin for everything, so the only allowed origin is the deployment's own URL.
      # Named CORS_ORIGINS in .env too — it is what the backend actually reads, and the old
      # name PUBLIC_URL collided with KP Front's PUBLIC_URL, which means something else there
      # (the base for absolute links in outbound webhooks). Copying one .env into the other
      # broke CORS silently. PUBLIC_URL stays accepted as a deprecated fallback.
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_URL:-http://localhost:8080}}
      # Login cookies are Secure by default. A browser DROPS a Secure cookie over plain
      # http://, so a trusted-LAN install with no DOMAIN must set this to false or nobody
      # can log in. Blank = leave the secure default alone.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-}
      # Must live under /mnt/data: entrypoint.sh chowns exactly that path to the non-root
      # app user, and a fresh named volume is otherwise created root-owned.
      PHOTOS_DIR: /mnt/data/photos
      # Admin account seeded on first boot (≥12 chars, required in production) — rotate
      # after the first login. The shared editor login is dev-only and never seeded here.
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?set ADMIN_SEED_PASSWORD in .env (≥12 chars)}
      # Read-only account, also required in production: seeding refuses to fall back to a
      # default viewer login on an internet-facing deployment.
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:?set VIEWER_PASSWORD in .env (≥12 chars)}
      # Optional integrations — leave blank to disable. See .env.example.
      DIVERA_ACCESS_KEY: ${DIVERA_ACCESS_KEY:-}
      TRACCAR_URL: ${TRACCAR_URL:-}
      TRACCAR_EMAIL: ${TRACCAR_EMAIL:-}
      TRACCAR_PASSWORD: ${TRACCAR_PASSWORD:-}
      # Shared secret for POST /api/alarms and the Divera webhook. Set it here and it wins
      # over the auto-generated value in the settings table, so a station never has to read
      # the secret back out of the database with SQL. Blank = keep using the DB value.
      ALARM_WEBHOOK_SECRET: ${ALARM_WEBHOOK_SECRET:-}
      # Shared secret for the pull-based thermal print agent (fail-closed when empty).
      PRINT_AGENT_TOKEN: ${PRINT_AGENT_TOKEN:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_REDIRECT_URI: ${MICROSOFT_REDIRECT_URI:-}
    volumes:
      - photos:/mnt/data/photos
    healthcheck:
      # The backend image ships no curl; probe with the interpreter instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s   # migrations + seed run before the first healthy response
    networks: [kprueck]

  frontend:
    image: ghcr.io/feuerwehr-oberwil/kp-rueck-frontend:${KP_RUECK_TAG:-latest}
    # Build from source instead: comment out `image:` and uncomment
    # build: { context: ./frontend, dockerfile: Dockerfile, target: runner }
    restart: unless-stopped
    # Memory ceiling. Not a reservation — it decides WHO gets killed when the box runs out,
    # rather than leaving that to the kernel's choice of victim. Numbers are ~2x the peak
    # measured on the production deployment (`railway metrics`, 2026-07-29), not guesses;
    # re-measure before tightening them.
    # 239 MB peak measured for the Next standalone server. 2x.
    mem_limit: 512m
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # RUNTIME api target for the Next.js /backend-api proxy route. The published image is
      # built WITHOUT NEXT_PUBLIC_API_URL on purpose — baking a URL in would tie the image to
      # one station. The browser calls /backend-api on its own origin and Next forwards here.
      API_URL: http://backend:8000
      NODE_ENV: production
    healthcheck:
      # 127.0.0.1, not localhost: Next binds IPv4 only (HOSTNAME=0.0.0.0) while `localhost`
      # resolves to ::1 first inside the image, so the probe would always be refused.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [kprueck]

  tileserver:
    image: ghcr.io/feuerwehr-oberwil/kp-rueck-tileserver:${KP_RUECK_TAG:-latest}
    # Build from source instead: comment out `image:` and uncomment
    # build: { context: ., dockerfile: ./tileserver/Dockerfile }
    restart: unless-stopped
    # Memory ceiling. Not a reservation — it decides WHO gets killed when the box runs out,
    # rather than leaving that to the kernel's choice of victim. Numbers are ~2x the peak
    # measured on the production deployment (`railway metrics`, 2026-07-29), not guesses;
    # re-measure before tightening them.
    # 103 MB observed locally; it memory-maps the MBTiles, so leave room for a
    # canton-sized file rather than the small default bbox.
    mem_limit: 512m
    logging: *default-logging
    environment:
      - TILESERVER_PORT=8080
    volumes:
      # Bootstrap tiles are generated on first run; drop real MBTiles in here for full
      # offline coverage (see docs/OFFLINE_MAPS.md).
      - tiles:/data
    healthcheck:
      # The tileserver image ships neither wget nor curl; probe via node.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks: [kprueck]

  # The single origin. With DOMAIN set it fetches a certificate automatically; without one it
  # serves plain HTTP on HTTP_PORT for a trusted LAN.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Memory ceiling. Not a reservation — it decides WHO gets killed when the box runs out,
    # rather than leaving that to the kernel's choice of victim. Numbers are ~2x the peak
    # measured on the production deployment (`railway metrics`, 2026-07-29), not guesses;
    # re-measure before tightening them.
    # A reverse proxy with a handful of routes.
    mem_limit: 128m
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      # Empty DOMAIN → Caddy binds :80 inside the container (plain HTTP, no cert).
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTP_PORT:-8080}:80"
      # Both host ports are variable so a station running KP Front and KP Rück on ONE box can
      # move this stack off 443 (the other stack, or a single shared reverse proxy, keeps it).
      # Caddy is NOT optional here — unlike KP Front, no other service publishes a port and
      # this is the single origin the Caddyfile routes. Don't gate it behind a profile.
      - "${HTTPS_PORT:-443}:443"
    networks: [kprueck]

  # Thermal printer agent for the command post. Opt-in: it needs to reach a printer on the
  # local LAN, so it runs on the host network and only starts with the `printing` profile:
  #   docker compose --profile printing up -d
  print-agent:
    # Neutral name on purpose: ONE agent serves KP Front and KP Rück both. The old
    # kp-rueck-print-agent name is still published for this release so nothing breaks on
    # update. To print from both systems, mount a config with a `backends` list instead of
    # the single-backend variables below — see tools/print-agent/README.md.
    image: ghcr.io/feuerwehr-oberwil/kp-print-agent:${KP_RUECK_TAG:-latest}
    # Build from source instead: comment out `image:` and uncomment
    # build: { context: ./tools/print-agent, dockerfile: Dockerfile }
    restart: unless-stopped
    # Memory ceiling. Not a reservation — it decides WHO gets killed when the box runs out,
    # rather than leaving that to the kernel's choice of victim. Numbers are ~2x the peak
    # measured on the production deployment (`railway metrics`, 2026-07-29), not guesses;
    # re-measure before tightening them.
    # Stdlib polling loop plus Pillow when it renders a QR code.
    mem_limit: 256m
    logging: *default-logging
    profiles: ["printing"]
    network_mode: "host"
    environment:
      # On the host network the stack isn't reachable by service name — point this at the
      # deployment's public URL (or http://localhost:<HTTP_PORT> on the same host).
      BACKEND_URL: ${PRINT_AGENT_BACKEND_URL:-http://localhost:8080}
      # The agent reads AGENT_TOKEN; the backend reads PRINT_AGENT_TOKEN. One value in .env
      # feeds both — they are the two ends of the same shared secret and must match.
      AGENT_TOKEN: ${PRINT_AGENT_TOKEN:-}
      # Adaptive polling: idle until a job arrives, then brisk for ACTIVE_DURATION seconds.
      POLL_INTERVAL_IDLE: ${PRINT_POLL_INTERVAL_IDLE:-60}
      POLL_INTERVAL_ACTIVE: ${PRINT_POLL_INTERVAL_ACTIVE:-5}
      DRY_RUN: ${DRY_RUN:-false}
      LOG_LEVEL: INFO

networks:
  kprueck:
    driver: bridge

volumes:
  pgdata:
  photos:
  tiles:
  caddy_data:
  caddy_config:
